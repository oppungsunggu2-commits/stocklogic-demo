            <div class="cover-panel" id="cover-panel-photo" role="tabpanel" hidden>
              <div class="cover-upload-row">
                <div id="cover-preview-photo" class="cover-preview" aria-label="Pratinjau foto cover">📷</div>
                <label class="field" style="flex:1">Pilih foto dari perangkat<input id="menu-cover-file" type="file" accept="image/*"><small style="font-weight:400">Pratinjau diperbarui saat file dipilih. Maks. 8 MB.</small></label>
              </div>
            </div>
            <div class="cover-panel" id="cover-panel-emoji" role="tabpanel">
              <div class="cover-upload-row">
                <div id="cover-preview-emoji" class="cover-preview" aria-label="Pratinjau emoji">${escapeHtml(menuCoverValue)}</div>
                <div><strong style="color:var(--navy);font-size:10px">Pilih ikon cepat</strong><small style="display:block;color:var(--muted);font-size:10px">Pilih emoji yang mewakili produk.</small></div>
              </div>
              <div class="cover-emoji-grid">${QUICK_EMOJIS.map(emoji => `<button type="button" data-cover-emoji="${emoji}" class="${emoji === menuCoverValue ? 'active' : ''}" aria-label="Pilih ${emoji}" aria-pressed="${emoji === menuCoverValue}" onclick="chooseMenuEmoji('${emoji}')">${emoji}</button>`).join('')}</div>
            </div>
          </section>
          <div class="card-title" style="margin:18px 0 9px"><div><h3>Pengaturan resep per 1 porsi</h3><p>Pilih bahan, sumber stok, dan takaran yang dipotong setiap terjual.</p></div><button type="button" class="secondary" onclick="addRecipeRow()">＋ Bahan</button></div>
          <div id="recipe-rows" class="list"></div>
          <div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary" type="submit">Simpan menu & resep</button></div>
        </form>`);
      document.getElementById('cover-panel-photo').hidden = menuCoverType !== 'photo';
      document.getElementById('cover-panel-emoji').hidden = menuCoverType !== 'emoji';
      document.getElementById(`cover-tab-${menuCoverType}`).classList.add('active');
      document.getElementById('menu-cover-file').addEventListener('change', handleMenuCoverUpload);
      updateMenuCoverPreview();
      if (menu) {
        menu.recipe.forEach(part => {
          addRecipeRow();
          const row = document.querySelector('#recipe-rows .recipe-row:last-child');
          row.querySelector('[data-recipe-inventory]').value = String(part.inventoryId);
          row.querySelector('[data-recipe-source]').value = part.source;
          row.querySelector('[data-recipe-qty]').value = part.qty;
        });
      } else {
        addRecipeRow();
      }
    }

    function renderCover(cover, fallbackEmoji, className) {
      const value = typeof cover === 'string' && cover ? cover : (fallbackEmoji || '🍽️');
      if (value.startsWith('data:image/')) return `<span class="${className}"><img src="${escapeHtml(value)}" alt="Cover ${escapeHtml(fallbackEmoji || 'menu')}" loading="lazy"></span>`;
      return `<span class="${className}" aria-label="Ikon ${escapeHtml(fallbackEmoji || 'menu')}">${escapeHtml(value)}</span>`;
    }

    function selectMenuCoverType(type) {
      if (!['photo', 'emoji'].includes(type)) return;
      menuCoverType = type;
      document.getElementById('cover-panel-photo').hidden = type !== 'photo';
      document.getElementById('cover-panel-emoji').hidden = type !== 'emoji';
      document.getElementById('cover-tab-photo').classList.toggle('active', type === 'photo');
      document.getElementById('cover-tab-emoji').classList.toggle('active', type === 'emoji');
      document.getElementById('cover-tab-photo').setAttribute('aria-selected', String(type === 'photo'));
      document.getElementById('cover-tab-emoji').setAttribute('aria-selected', String(type === 'emoji'));
      updateMenuCoverPreview();
    }

    function chooseMenuEmoji(emoji) {
      if (!QUICK_EMOJIS.includes(emoji)) return;
      menuCoverType = 'emoji';
      menuCoverValue = emoji;
      selectMenuCoverType('emoji');
      document.querySelectorAll('[data-cover-emoji]').forEach(button => {
        const selected = button.dataset.coverEmoji === emoji;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    function updateMenuCoverPreview() {
      const preview = document.getElementById(menuCoverType === 'photo' ? 'cover-preview-photo' : 'cover-preview-emoji');
      if (!preview) return;
      if (menuCoverType === 'photo' && menuUploadedCover) {
        preview.innerHTML = `<img src="${escapeHtml(menuUploadedCover)}" alt="Pratinjau cover menu">`;
      } else {
        preview.textContent = menuCoverType === 'photo' ? '📷' : menuCoverValue;
      }
    }

    function handleMenuCoverUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        event.target.value = '';
        return toast('Pilih file gambar yang valid.', 'error');
      }
      if (file.size > 8 * 1024 * 1024) {
        event.target.value = '';
        return toast('Ukuran gambar maksimal 8 MB.', 'warning');
      }
      const reader = new FileReader();
      reader.onerror = () => toast('Gambar gagal dibaca. Coba pilih file lain.', 'error');
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => toast('File tidak dapat diproses sebagai gambar.', 'error');
        image.onload = () => {
          const maxDimension = 1200;
          const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) return toast('Pratinjau gambar tidak dapat dibuat di browser ini.', 'error');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          try {
            menuUploadedCover = canvas.toDataURL('image/jpeg', 0.84);
            menuCoverType = 'photo';
            selectMenuCoverType('photo');
            toast('Foto berhasil dimuat. Pratinjau cover sudah diperbarui.', 'success');
          } catch (error) {
            console.error('Gagal mengolah foto cover menu:', error);
            toast('Foto gagal diproses. Coba gunakan gambar lain.', 'error');
          }
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function addRecipeRow() {
      const host = document.getElementById('recipe-rows');
      if (!host) return;
      const row = document.createElement('div');
      row.className = 'recipe-row';
      row.innerHTML = `<label class="field">Bahan<select data-recipe-inventory required>${db.inventory.map(item => `<option value="${item.id}">${escapeHtml(item.name)} (${escapeHtml(item.unit)})</option>`).join('')}</select></label>
        <label class="field">Sumber stok<select data-recipe-source required><option value="daily">Stok harian</option><option value="warehouse">Gudang induk</option></select></label>
        <label class="field">Takaran<input data-recipe-qty type="number" min="0.001" step="0.001" required placeholder="0.1"></label>
        <button type="button" class="danger remove-row" aria-label="Hapus bahan" onclick="this.parentElement.remove()">×</button>`;
      host.appendChild(row);
    }

    function createMenu() {
      const name = document.getElementById('menu-name').value.trim();
      const category = document.getElementById('menu-category').value;
      const price = Number(document.getElementById('menu-price').value);
      const cover = menuCoverType === 'photo' ? menuUploadedCover : menuCoverValue;
      const current = editingMenuId ? menuItem(editingMenuId) : null;
      const rows = [...document.querySelectorAll('.recipe-row')];
      const recipe = rows.map(row => ({ inventoryId: Number(row.querySelector('[data-recipe-inventory]').value), source: row.querySelector('[data-recipe-source]').value, qty: Number(row.querySelector('[data-recipe-qty]').value) }));
      if (!name || !['Makanan', 'Minuman', 'Sembako'].includes(category) || !Number.isFinite(price) || price <= 0) return toast('Nama, kategori, dan harga menu wajib valid.', 'error');
      if (db.menus.some(item => item.name.toLowerCase() === name.toLowerCase() && item.id !== editingMenuId)) return toast('Nama menu sudah digunakan.', 'error');
      if (menuCoverType === 'photo' && !cover.startsWith('data:image/')) return toast('Unggah foto cover terlebih dahulu atau pilih emoji.', 'warning');
      if (!recipe.length || recipe.some(part => !inventoryItem(part.inventoryId) || !['daily', 'warehouse'].includes(part.source) || !Number.isFinite(part.qty) || part.qty <= 0)) return toast('Tambahkan minimal satu bahan resep dengan takaran yang valid.', 'error');
      if (current && !db.menus.includes(current)) return toast('Menu yang diedit sudah tidak tersedia. Buka kembali daftar menu.', 'error');
      const before = clone(db);
      if (current) Object.assign(current, { name, category, price: round2(price), emoji: menuCoverType === 'emoji' ? cover : '🍽️', cover, recipe });
      else db.menus.push({ id: Date.now(), name, category, price: round2(price), emoji: menuCoverType === 'emoji' ? cover : '🍽️', cover, sold: 0, recipe });
      if (!saveDB()) {
        db = before;
        render();
        return;
      }
      closeModal();
      editingMenuId = null;
      toast(`${name} ${current ? 'diperbarui' : 'tersimpan'} dengan ${recipe.length} bahan resep.`, 'success');
      render();
    }

    const expenseCategories = ['Sewa', 'Listrik', 'Air', 'Gas', 'Transportasi', 'Gaji', 'Perlengkapan', 'Lainnya'];
    const formatDate = value => value ? new Date(`${value}T00:00:00`).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
    const transactionDate = item => item.date || localDate(new Date(item.timestamp));
    const menuCost = menu => (menu.recipe || []).reduce((total, part) => {
      const item = inventoryItem(part.inventoryId);
      return total + (item ? Number(part.qty || 0) * Number(item.cost || 0) : 0);
    }, 0);
    const lineQuantity = line => Number(line.qty || 0);

    function transactionSalesByMenu() {
      const sales = new Map(db.menus.map(menu => [menu.id, Array(30).fill(0)]));
      const today = new Date(`${localDate()}T00:00:00`);
      activeTransactions().forEach(transaction => {
        const date = new Date(`${transactionDate(transaction)}T00:00:00`);
        const daysAgo = Math.round((today - date) / 86400000);
        if (daysAgo < 0 || daysAgo >= 30 || !Array.isArray(transaction.lines)) return;
        transaction.lines.forEach(line => {
          const dailySales = sales.get(Number(line.id));
          if (dailySales) dailySales[daysAgo] += lineQuantity(line);
        });
      });
      return sales;
    }

    function buildForecast() {
      const sales = transactionSalesByMenu();
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const weekday = tomorrow.getDay();
      const menuForecast = new Map();
      db.menus.forEach(menu => {
        const history = sales.get(menu.id) || Array(30).fill(0);
        const sameWeekday = history.filter((_, daysAgo) => daysAgo > 0 && new Date(Date.now() - daysAgo * 86400000).getDay() === weekday);
        const recentAverage = history.slice(1, 8).reduce((sum, value) => sum + value, 0) / 7;
        const weekdayAverage = sameWeekday.length ? sameWeekday.reduce((sum, value) => sum + value, 0) / sameWeekday.length : recentAverage;
        menuForecast.set(menu.id, Math.max(0, Math.round(weekdayAverage * 0.6 + recentAverage * 0.4)));
      });

      const labels = [];
      const actual = [];
      const estimate = [];
      const totals = Array(30).fill(0);
      sales.forEach(values => values.forEach((value, index) => { totals[index] += value; }));
      for (let daysAgo = 14; daysAgo >= 1; daysAgo--) {
        const date = new Date(Date.now() - daysAgo * 86400000);
        labels.push(date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
        actual.push(totals[daysAgo]);
        estimate.push(Math.round(totals.slice(daysAgo + 1, daysAgo + 8).reduce((sum, value) => sum + value, 0) / 7));
      }
      labels.push('Besok');
      actual.push(null);
      estimate.push([...menuForecast.values()].reduce((sum, value) => sum + value, 0));

      const needs = new Map();
      db.menus.forEach(menu => (menu.recipe || []).forEach(part => {
        const item = inventoryItem(part.inventoryId);
        if (!item) return;
        const entry = needs.get(item.id) || { item, quantity: 0 };
        entry.quantity += Number(part.qty || 0) * (menuForecast.get(menu.id) || 0);
        needs.set(item.id, entry);
      }));
      const restock = [...needs.values()].map(entry => {
        const dailyAvailable = db.shift.active ? Number(db.shift.dailyStock[entry.item.id]?.available || 0) : 0;
        const totalAvailable = Number(entry.item.stock || 0) + dailyAvailable;
        const target = entry.quantity * 1.1 + Number(entry.item.min || 0);
        return { ...entry, available: totalAvailable, suggested: Math.max(0, Math.ceil((target - totalAvailable) * 1000) / 1000) };
      }).filter(entry => entry.quantity > 0).sort((a, b) => b.suggested * b.item.cost - a.suggested * a.item.cost);
      return { menuForecast, total: [...menuForecast.values()].reduce((sum, value) => sum + value, 0), labels, actual, estimate, restock };
    }

    function menuPerformance() {
      const sales = transactionSalesByMenu();
      return db.menus.map(menu => {
        const sold = (sales.get(menu.id) || []).reduce((sum, value) => sum + value, 0);
        const margin = Number(menu.price || 0) - menuCost(menu);
        return { menu, sold, margin, contribution: sold * margin };
      }).sort((a, b) => b.contribution - a.contribution);
    }

    function estimateWasteRisk() {
      const consumption = new Map(db.inventory.map(item => [item.id, 0]));
      activeTransactions().forEach(transaction => {
        const date = new Date(`${transactionDate(transaction)}T00:00:00`);
        if ((Date.now() - date.getTime()) / 86400000 > 14 || !Array.isArray(transaction.lines)) return;
        transaction.lines.forEach(line => {
          const menu = menuItem(line.id);
          (menu?.recipe || []).forEach(part => consumption.set(Number(part.inventoryId), (consumption.get(Number(part.inventoryId)) || 0) + Number(part.qty || 0) * lineQuantity(line)));
        });
      });
      return db.inventory.filter(item => item.expiryDate).map(item => {
        const days = Math.ceil((new Date(`${item.expiryDate}T23:59:59`).getTime() - Date.now()) / 86400000);
        const perDay = (consumption.get(item.id) || 0) / 14;
        const stock = Number(item.stock || 0) + Number(db.shift.dailyStock[item.id]?.available || 0);
        const remaining = Math.max(0, stock - perDay * Math.max(days, 0));
        const risk = days <= 0 && stock > 0 || days <= 3 && remaining > stock * 0.5 ? 'Tinggi' : days <= 7 && remaining > stock * 0.2 ? 'Sedang' : 'Rendah';
        return { item, days, perDay, remaining, value: remaining * Number(item.cost || 0), risk };
      }).sort((a, b) => b.value - a.value);
    }

    function buildAlerts() {
      const lowStock = db.inventory.filter(item => Number(item.stock || 0) <= Number(item.min || 0)).map(item => `${item.stock <= 0 ? 'Stok habis' : 'Stok menipis'}: ${item.name} (${quantity(item.stock)} ${item.unit})`);
      const expiry = estimateWasteRisk().filter(entry => entry.risk === 'Tinggi').map(entry => `Risiko kedaluwarsa: ${entry.item.name} (${entry.item.expiryDate})`);
      return [...lowStock, ...expiry];
    }

    function buildDashboardPerformance(days) {
      const labels = [], revenue = [], net = [];
      const today = new Date(`${localDate()}T00:00:00`);
      for (let offset = days - 1; offset >= 0; offset--) {
        const date = new Date(today);
        date.setDate(date.getDate() - offset);
        const key = localDate(date);
        const transactions = activeTransactions().filter(item => transactionDate(item) === key);
        const costs = db.expenses.filter(item => item.date === key).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        labels.push(date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
        revenue.push(transactions.reduce((sum, item) => sum + Number(item.total || 0), 0));
        net.push(transactions.reduce((sum, item) => sum + Number(item.profit || 0), 0) - costs);
      }
      return { labels, revenue, net, hasData: revenue.some(value => value > 0) || net.some(value => value !== 0) };
    }

    function buildStockMovementChart(days) {
      const labels = [], incoming = [], outgoing = [];
      const midnight = new Date(`${localDate()}T00:00:00`);
      let hasData = false;
      for (let offset = days - 1; offset >= 0; offset--) {
        const date = new Date(midnight);
        date.setDate(date.getDate() - offset);
        const key = localDate(date);
        let inValue = 0, outValue = 0;
        db.stockMovements.filter(entry => localDate(new Date(entry.timestamp)) === key).forEach(entry => {
          const item = inventoryItem(entry.inventoryId);
          if (!item) return;
          const value = Math.abs(Number(entry.delta || 0) * Number(item.cost || 0));
          if (entry.delta > 0) inValue += value;
          else outValue += value;
        });
        labels.push(date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
        incoming.push(inValue);
        outgoing.push(outValue);
        if (inValue > 0 || outValue > 0) hasData = true;
      }
      return { labels, incoming, outgoing, hasData };
    }

    function renderLineChart(labels, series, formatter = value => money(value), emptyMessage = '') {
      const width = 680, height = 220, left = 54, right = 12, top = 14, bottom = 28;
      const values = series.flatMap(item => item.values).filter(Number.isFinite);
      if (!labels.length || !values.length) return `<div class="empty">${escapeHtml(emptyMessage || 'Belum ada data pada periode ini.')}</div>`;
      const hasNonZero = values.some(value => value !== 0);
      const max = hasNonZero ? Math.max(...values, 0) : 1;
      const min = hasNonZero ? Math.min(...values, 0) : -1;
      const range = max - min || 1;
      const x = index => left + (width - left - right) * (labels.length === 1 ? 0.5 : index / (labels.length - 1));
      const y = value => top + (height - top - bottom) * (1 - (value - min) / range);
      const grid = [0, .25, .5, .75, 1].map(ratio => {
        const value = min + range * ratio;
        return `<line x1="${left}" x2="${width - right}" y1="${y(value)}" y2="${y(value)}" stroke="#e2e8f0"/><text x="${left - 7}" y="${y(value) + 4}" text-anchor="end" class="chart-label">${escapeHtml(formatter(value))}</text>`;
      }).join('');
      const lines = series.map(item => {
        const points = item.values.map((value, index) => Number.isFinite(value) ? `${x(index)},${y(value)}` : '').filter(Boolean).join(' ');
        return `<polyline points="${points}" fill="none" stroke="${item.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      }).join('');
      const axis = labels.map((label, index) => index % Math.max(1, Math.ceil(labels.length / 7)) === 0 || index === labels.length - 1 ? `<text x="${x(index)}" y="${height - 7}" text-anchor="middle" class="chart-label">${escapeHtml(label)}</text>` : '').join('');
      return `<div class="chart-frame"><svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Grafik performa">${grid}${lines}${axis}</svg>${emptyMessage ? `<div class="chart-empty">${escapeHtml(emptyMessage)}</div>` : ''}</div><div class="chart-legend">${series.map(item => `<span><i style="background:${item.color}"></i>${escapeHtml(item.name)}</span>`).join('')}</div>`;
    }

    function renderIntelligence() {
      const forecast = buildForecast();
      const performance = menuPerformance();
      const risks = estimateWasteRisk();
      const top = performance[0];
      const highRisk = risks.filter(entry => entry.risk === 'Tinggi');
      return `${pageHeading('Prediksi & AI', 'Analisis berbasis aturan dari transaksi, resep, stok, dan tanggal kedaluwarsa yang Anda masukkan.')}
        <div class="alert-item" style="margin-bottom:16px">Simulasi analitik lokal, bukan model AI/ML atau saran profesional. Hasil prediksi bergantung pada kelengkapan data transaksi.</div>
        <section class="grid stats">
          ${statCard('Prediksi porsi besok', quantity(forecast.total), 'Rata-rata hari sejenis dan 7 hari terakhir', '◷', 'cyan')}
          ${statCard('Menu kontribusi tertinggi', top ? escapeHtml(top.menu.name) : '—', top ? `${quantity(top.sold)} terjual · margin ${money(top.margin)}/porsi` : 'Belum ada riwayat penjualan', '✳', 'green')}
          ${statCard('Bahan perlu restock', forecast.restock.filter(item => item.suggested > 0).length, 'Mengikuti kebutuhan menu besok + buffer 10%', '⚑', 'amber')}
          ${statCard('Risiko kedaluwarsa tinggi', highRisk.length, `${money(highRisk.reduce((sum, item) => sum + item.value, 0))} estimasi nilai tersisa`, '⚠', highRisk.length ? '' : 'green')}
        </section>
        <section class="analytics-grid">
          <article class="card"><div class="card-title"><div><h3>Prediksi permintaan</h3><p>Penjualan dan estimasi porsi per hari.</p></div></div>${renderLineChart(forecast.labels, [{ name: 'Aktual', color: '#1677C8', values: forecast.actual }, { name: 'Estimasi', color: '#FF9F43', values: forecast.estimate }], value => `${quantity(value)} porsi`, forecast.actual.some(value => value > 0) ? '' : 'Belum ada transaksi. Garis prediksi mulai terisi setelah penjualan tercatat.')}</article>
          <article class="card"><div class="card-title"><div><h3>Rekomendasi restock</h3><p>Perkiraan kebutuhan menu besok dibanding stok tersedia.</p></div></div>${forecast.restock.some(item => item.suggested > 0) ? `<div class="table-wrap"><table><thead><tr><th>Bahan</th><th>Perkiraan kebutuhan</th><th>Stok total</th><th>Saran beli</th></tr></thead><tbody>${forecast.restock.filter(item => item.suggested > 0).map(entry => `<tr><td class="table-name">${escapeHtml(entry.item.name)}</td><td>${quantity(entry.quantity)} ${escapeHtml(entry.item.unit)}</td><td>${quantity(entry.available)} ${escapeHtml(entry.item.unit)}</td><td><strong>${quantity(entry.suggested)} ${escapeHtml(entry.item.unit)}</strong></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Stok saat ini cukup untuk estimasi permintaan besok.</div>'}</article>
          <article class="card"><div class="card-title"><div><h3>Analisis risiko kedaluwarsa</h3><p>Hanya bahan yang memiliki tanggal kedaluwarsa.</p></div></div>${risks.length ? `<div class="table-wrap"><table><thead><tr><th>Bahan</th><th>Kedaluwarsa</th><th>Sisa hari</th><th>Risiko</th><th>Perkiraan nilai terancam</th></tr></thead><tbody>${risks.map(entry => `<tr><td class="table-name">${escapeHtml(entry.item.name)}</td><td>${formatDate(entry.item.expiryDate)}</td><td>${entry.days}</td><td><span class="pill ${entry.risk === 'Tinggi' ? 'red' : entry.risk === 'Sedang' ? 'amber' : 'green'}">${entry.risk}</span></td><td>${money(entry.value)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Tambahkan tanggal kedaluwarsa saat restock agar analisis risiko dapat dihitung.</div>'}</article>
          <article class="card"><div class="card-title"><div><h3>Smart Menu Optimizer</h3><p>Stars, Ploughhorses, Puzzles, dan Dogs memakai volume serta margin rata-rata 30 hari; margin dihitung dari resep dan biaya bahan saat ini.</p></div></div>${performance.length ? `<div class="table-wrap"><table><thead><tr><th>Menu</th><th>Terjual</th><th>Margin / porsi</th><th>Kontribusi 30 hari</th><th>Kategori & saran</th></tr></thead><tbody>${performance.map(entry => {
          const avgSold = performance.reduce((sum, row) => sum + row.sold, 0) / (performance.length || 1);
          const avgMargin = performance.reduce((sum, row) => sum + row.margin, 0) / (performance.length || 1);
          const popular = avgSold > 0 && entry.sold >= avgSold * 0.7, profitable = entry.margin >= avgMargin;
          const label = avgSold === 0 ? 'Belum ada data' : popular && profitable ? 'Stars' : popular ? 'Ploughhorses' : profitable ? 'Puzzles' : 'Dogs';
          const advice = avgSold === 0 ? 'Analisis kategori tersedia setelah transaksi pertama.' : label === 'Stars' ? 'Pertahankan kualitas dan pastikan bahan utama selalu tersedia.' : label === 'Ploughhorses' ? 'Menu laris; uji penyesuaian porsi atau harga agar margin meningkat.' : label === 'Puzzles' ? 'Margin baik; uji promosi dan posisi menu untuk menaikkan volume.' : 'Evaluasi resep, harga, atau kelanjutan menu berdasarkan permintaan.';
          const tone = label === 'Stars' ? 'green' : label === 'Ploughhorses' ? '' : label === 'Puzzles' ? 'amber' : 'red';
          return `<tr><td class="table-name">${escapeHtml(entry.menu.name)}</td><td>${quantity(entry.sold)}</td><td>${money(entry.margin)}</td><td>${money(entry.contribution)}</td><td><span class="pill ${tone}">${label}</span><br><small>${advice}</small></td></tr>`;
        }).join('')}</tbody></table></div>` : '<div class="empty">Belum ada menu untuk dianalisis.</div>'}</article>
          <article class="card" style="grid-column:1/-1"><div class="card-title"><div><h3>Asisten Bisnis (simulasi)</h3><p>Pilih pertanyaan untuk melihat ringkasan berdasarkan data aplikasi.</p></div></div>
            <div class="tb">${['Bahan apa yang harus dibeli besok?', 'Menu apa yang paling menguntungkan?', 'Berapa laba bersih periode ini?', 'Bahan apa yang berisiko kedaluwarsa?', 'Bagaimana meningkatkan margin?', 'Berapa target untuk mencapai BEP?'].map(question => `<button class="secondary" onclick="answerBusinessQuestion('${question}')">${question}</button>`).join('')}</div>
            <form class="filter-row" onsubmit="event.preventDefault();answerBusinessQuestion(document.getElementById('assistant-question').value)"><label class="field" style="flex:1">Tanya singkat<input id="assistant-question" maxlength="160" placeholder="Contoh: bahan apa yang perlu dibeli?"></label><button class="primary">Tanyakan</button></form>
            ${assistantAnswer ? `<div class="assistant-answer">${assistantAnswer}</div>` : '<div class="empty">Jawaban akan muncul di sini. Asisten hanya memakai aturan dan data lokal.</div>'}
          </article>
        </section>`;
    }

    function answerBusinessQuestion(question) {
      const query = String(question || '').trim().toLowerCase();
      if (!query) return toast('Tulis atau pilih pertanyaan terlebih dahulu.', 'warning');
      const forecast = buildForecast();
      const performance = menuPerformance();
      const risk = estimateWasteRisk().filter(entry => entry.risk !== 'Rendah');
      const expenses = db.expenses.filter(item => item.date >= reportFrom && item.date <= reportTo).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const transactions = activeTransactions().filter(item => transactionDate(item) >= reportFrom && transactionDate(item) <= reportTo);
      const revenue = transactions.reduce((sum, item) => sum + Number(item.total || 0), 0);
      const gross = transactions.reduce((sum, item) => sum + Number(item.profit || 0), 0);
      const answer = query.includes('beli') || query.includes('restock')
        ? (forecast.restock.filter(item => item.suggested > 0).slice(0, 5).map(item => `${escapeHtml(item.item.name)} ${quantity(item.suggested)} ${escapeHtml(item.item.unit)}`).join(', ') || 'Stok diperkirakan cukup untuk besok.')
        : query.includes('kedaluwarsa') || query.includes('risiko')
          ? (risk.map(item => `${escapeHtml(item.item.name)} (${item.risk}, ${formatDate(item.item.expiryDate)})`).join(', ') || 'Tidak ada risiko tinggi/sedang dari tanggal kedaluwarsa yang tercatat.')
          : query.includes('bep') || query.includes('target')
            ? calculateBreakEven(transactions, expenses)
            : query.includes('untung') || query.includes('laba') || query.includes('keuntungan')
              ? `Omzet ${money(revenue)}, laba kotor ${money(gross)}, biaya operasional ${money(expenses)}, estimasi laba bersih ${money(gross - expenses)} pada periode laporan.`
              : query.includes('margin') || query.includes('profit')
                ? (performance.filter(entry => entry.margin < 0 || entry.margin < (performance.reduce((sum, item) => sum + item.margin, 0) / (performance.length || 1))).slice(0, 4).map(entry => `${escapeHtml(entry.menu.name)} (margin ${money(entry.margin)})`).join(', ') || 'Margin menu saat ini berada di atas rata-rata resep yang terdaftar.')
                : performance.length && performance[0].sold
                  ? `Kontribusi terbesar 30 hari terakhir: ${escapeHtml(performance[0].menu.name)} (${money(performance[0].contribution)}). Margin per porsi tertinggi: ${escapeHtml(performance.slice().sort((a, b) => b.margin - a.margin)[0].menu.name)}.`
                  : 'Belum ada transaksi dengan rincian menu untuk dianalisis.';
      assistantAnswer = `<strong>${escapeHtml(question)}</strong><br>${answer}<br><small>Simulasi berbasis aturan; bukan model AI.</small>`;
      render();
    }

    function calculateBreakEven(transactions, expenses) {
      const quantitySold = transactions.reduce((sum, transaction) => sum + (transaction.lines || []).reduce((lineSum, line) => lineSum + lineQuantity(line), 0), 0);
      const revenue = transactions.reduce((sum, transaction) => sum + Number(transaction.total || 0), 0);
      const cogs = transactions.reduce((sum, transaction) => sum + Number(transaction.cogs || 0), 0);
      const averageContribution = quantitySold ? revenue / quantitySold - cogs / quantitySold : 0;
      const target = averageContribution > 0 ? Math.ceil(expenses / averageContribution) : 0;
      return averageContribution > 0 ? `Biaya operasional ${money(expenses)}. Dengan kontribusi rata-rata ${money(averageContribution)} per item, estimasi titik impas periode ini sekitar ${quantity(target)} item.` : 'Data belum cukup untuk menghitung titik impas; pastikan ada transaksi dengan rincian menu dan margin positif.';
    }

    function renderStockMovementTable() {
      const rows = db.stockMovements.slice().reverse().slice(0, 25);
      return rows.length ? `<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Bahan</th><th>Sumber</th><th>Perubahan</th><th>Jenis</th><th>Catatan</th></tr></thead><tbody>${rows.map(entry => {
        const item = inventoryItem(entry.inventoryId);
        return `<tr><td>${new Date(entry.timestamp).toLocaleString('id-ID')}</td><td>${escapeHtml(item?.name || 'Bahan dihapus')}</td><td>${entry.source === 'daily' ? 'Stok harian' : 'Gudang induk'}</td><td><strong style="color:${entry.delta >= 0 ? '#047857' : '#b91c1c'}">${entry.delta > 0 ? '+' : ''}${quantity(entry.delta)} ${escapeHtml(item?.unit || '')}</strong></td><td>${escapeHtml(entry.type)}</td><td>${escapeHtml(entry.note || '—')}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="empty">Pergerakan stok akan tercatat saat restock, transfer shift, dan transaksi berikutnya.</div>';
    }

    function openExpenseModal(id) {
      const expense = db.expenses.find(item => item.id === id);
      const current = expense || { category: 'Listrik', date: localDate(), amount: '', note: '' };
      showModal(expense ? 'Ubah biaya operasional' : 'Tambah biaya operasional', 'Biaya dimasukkan ke laporan laba bersih, tidak mengubah stok.', `
        <form onsubmit="event.preventDefault();saveExpense('${expense ? expense.id : ''}')"><div class="form-grid">
          <label class="field">Kategori<select id="expense-category">${expenseCategories.map(category => `<option ${current.category === category ? 'selected' : ''}>${category}</option>`).join('')}</select></label>
          <label class="field">Jumlah (Rp)<input id="expense-amount" type="number" min="1" step="1" value="${escapeHtml(current.amount)}" required></label>

    function saveExpense(id) {
      const amount = Number(document.getElementById('expense-amount').value);
      const date = document.getElementById('expense-date').value;
      if (!Number.isFinite(amount) || amount <= 0 || !date) return toast('Jumlah dan tanggal biaya harus valid.', 'error');
      const values = { category: document.getElementById('expense-category').value, amount: round2(amount), date, note: document.getElementById('expense-note').value.trim() };
      const existing = db.expenses.find(item => item.id === id);
      if (existing) Object.assign(existing, values);
      else db.expenses.unshift({ id: `EXP-${Date.now()}`, ...values, timestamp: new Date().toISOString() });
      closeModal();
      saveDB();
      render();
      toast('Biaya operasional tersimpan.', 'success');
    }

    function deleteExpense(id) {
      if (!confirm('Hapus catatan biaya ini?')) return;
      db.expenses = db.expenses.filter(item => item.id !== id);
      saveDB();
      render();
      toast('Biaya dihapus.', 'success');
    }

    function exportCsv(filename, rows) {
      const content = '\ufeff' + rows.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob([content], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function renderReports() {
      const transactions = activeTransactions().filter(item => transactionDate(item) >= reportFrom && transactionDate(item) <= reportTo);
      const simulatedCount = transactions.filter(item => item.isSimulated).length;
      const revenue = transactions.reduce((sum, item) => sum + item.total, 0);

      const grossProfit = transactions.reduce((sum, item) => sum + item.profit, 0);
      const expenses = db.expenses.filter(item => item.date >= reportFrom && item.date <= reportTo);
      const expenseTotal = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const profit = grossProfit - expenseTotal;
      const daily = transactions.filter(item => item.cashier === 'daily');
      const retail = transactions.filter(item => item.cashier === 'retail');
      const transactionRows = db.transactions.filter(item => transactionDate(item) >= reportFrom && transactionDate(item) <= reportTo).map(item => `<tr><td class="table-name">${escapeHtml(item.id)}</td><td>${escapeHtml(transactionDate(item))} · ${escapeHtml(item.time || '—')}</td><td><span class="pill ${item.cashier === 'retail' ? '' : 'green'}">${item.cashier === 'retail' ? 'Kasir 2 · Sembako' : 'Kasir 1 · Harian'}</span><br><small>${escapeHtml(item.paymentMethod || 'Tunai')}</small></td><td>${item.isSimulated ? '<span class="pill amber">SIMULASI</span>' : '<span class="pill green">Aktual</span>'}</td><td>${escapeHtml(item.items)}</td><td>${money(item.total)}</td><td>${money(item.cogs)}</td><td><strong>${money(item.profit)}</strong></td><td>${item.cancelled ? '<span class="pill red">Dibatalkan</span>' : '<span class="pill green">Selesai</span>'}</td><td><button class="ghost" onclick="showTransactionReceipt('${escapeHtml(item.id)}')">Struk</button> ${!item.isSimulated && !item.cancelled && item.consumption?.length ? `<button class="danger" onclick="cancelTransaction('${escapeHtml(item.id)}')">Batalkan</button>` : ''}</td></tr>`).join('');
      const historyRows = db.shiftHistory.map(item => `<div class="row"><div class="row-main"><strong>${escapeHtml(item.id)} · ${escapeHtml(item.date)}</strong><small>${escapeHtml(item.startedAt)}–${escapeHtml(item.closedAt)} · ${item.transactions} transaksi</small></div><div class="row-side"><strong>${money(item.revenue)}</strong><small>omzet kasir harian</small></div></div>`).join('');
      const labels = [];

          labels.push(cursor.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
          revenueSeries.push(dayTransactions.reduce((sum, item) => sum + item.total, 0));
          netSeries.push(dayTransactions.reduce((sum, item) => sum + item.profit, 0) - dayExpenses);
        }
      }
      const purchases = db.purchases.filter(item => localDate(new Date(item.timestamp)) >= reportFrom && localDate(new Date(item.timestamp)) <= reportTo).reduce((sum, item) => sum + Number(item.total || 0), 0);
      const netCashFlow = revenue - purchases - expenseTotal;
      const expensesRows = expenses.slice().sort((a, b) => b.date.localeCompare(a.date)).map(item => `<tr><td>${escapeHtml(item.date)}</td><td>${escapeHtml(item.category)}</td><td>${escapeHtml(item.note || '—')}</td><td>${money(item.amount)}</td><td><button class="ghost" onclick="openExpenseModal('${escapeHtml(item.id)}')">Ubah</button> <button class="danger" onclick="deleteExpense('${escapeHtml(item.id)}')">Hapus</button></td></tr>`).join('');
      const be = calculateBreakEven(transactions, expenseTotal);
      return `${pageHeading('Laporan Keuangan', 'Ringkasan transaksi aktual dan simulasi berlabel, HPP resep, biaya operasional, dan riwayat shift.', '<button class="primary" onclick="openExpenseModal()">＋ &nbsp;Tambah Biaya</button>')}
        <article class="card" style="margin-bottom:16px"><div class="filter-row">
          <label class="field">Dari tanggal<input type="date" value="${escapeHtml(reportFrom)}" onchange="reportFrom=this.value;render()"></label>
          <label class="field">Sampai tanggal<input type="date" value="${escapeHtml(reportTo)}" onchange="reportTo=this.value;render()"></label>
          <button class="secondary" onclick="reportFrom=localDate(new Date(Date.now()-6*86400000));reportTo=localDate();render()">7 hari</button>
          <button class="secondary" onclick="reportFrom=localDate(new Date(Date.now()-29*86400000));reportTo=localDate();render()">30 hari</button>
          <button class="secondary" onclick="reportFrom=localDate(new Date(Date.now()-89*86400000));reportTo=localDate();render()">90 hari</button>
          <button class="secondary" onclick="exportTransactionsCsv()">CSV Transaksi</button>
          <button class="secondary" onclick="exportSummaryCsv()">CSV Ringkasan</button>
          <button class="secondary" onclick="window.print()">Cetak</button>
        </div>
        <section class="grid stats report-summary">
          ${statCard('Total omzet', money(revenue), `${transactions.length} transaksi · ${simulatedCount} simulasi`, '↗', 'cyan')}
          ${statCard('HPP resep terjual', money(cogs), 'Biaya bahan berdasarkan resep', '◈', 'amber')}
          ${statCard('Laba kotor', money(grossProfit), 'Omzet dikurangi HPP', '⌁', 'green')}
          ${statCard('Laba bersih', money(profit), `Setelah biaya ${money(expenseTotal)}`, '✓', profit >= 0 ? 'green' : 'amber')}
        </section>
        <div class="row"><div class="row-main"><strong>Arus kas simulasi</strong><small>Termasuk ${simulatedCount} transaksi contoh yang ditandai SIMULASI. Kas masuk penjualan ${money(revenue)} − pembelian stok ${money(purchases)} − biaya operasional ${money(expenseTotal)} · modal awal shift tidak dihitung sebagai pendapatan.</small></div><div class="row-side"><strong>${money(netCashFlow)}</strong><small>Kas masuk bersih · ${daily.length} transaksi harian / ${retail.length} eceran</small></div></div>
        <div class="row"><div class="row-main"><strong>Titik impas</strong><small>Pembelian stok adalah arus kas keluar, bukan HPP sebelum bahan digunakan.</small></div><div class="row-side" style="flex:0 1 300px;min-width:0;overflow-wrap:anywhere;white-space:normal"><strong style="white-space:normal;overflow-wrap:anywhere">${escapeHtml(be)}</strong><small>Estimasi berdasarkan transaksi aktif dan biaya periode</small></div></div>

        <section class="analytics-grid" style="margin-bottom:16px">

          ${expensesRows ? `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${expensesRows}</tbody></table></div>` : '<div class="empty">Belum ada biaya operasional pada periode ini.</div>'}
        </article>
        <article class="card" style="margin-bottom:16px"><div class="card-title"><div><h3>Rincian transaksi</h3><p>Riwayat kedua kasir. Transaksi batal tidak masuk hitungan omzet.</p></div></div>

        </article>
        <article class="card"><div class="card-title"><div><h3>Riwayat shift</h3><p>Rekap sesi kerja harian yang telah ditutup.</p></div></div>${historyRows ? `<div class="list">${historyRows}</div>` : '<div class="empty">Riwayat shift yang selesai akan tampil di sini.</div>'}</article>`;
    }

    function exportTransactionsCsv() {
      const transactions = db.transactions.filter(item => transactionDate(item) >= reportFrom && transactionDate(item) <= reportTo);
      exportCsv('stocklogic_transaksi.csv', [['ID', 'Tanggal', 'Kasir', 'Jenis data', 'Item', 'Diskon', 'Omzet', 'HPP', 'Laba kotor', 'Metode pembayaran', 'Status'], ...transactions.map(item => [item.id, transactionDate(item), item.cashier, item.isSimulated ? 'Simulasi' : 'Aktual', item.items, item.discount || 0, item.total, item.cogs, item.profit, item.paymentMethod || 'Tunai', item.cancelled ? 'Dibatalkan' : 'Selesai'])]);
    }

    function exportSummaryCsv() {
      exportCsv('stocklogic_ringkasan.csv', [['Tanggal', 'Omzet', 'HPP', 'Pembelian stok', 'Biaya operasional', 'Laba bersih', 'Arus kas bersih'], ...Array.from({ length: Math.min(120, Math.max(0, (new Date(`${reportTo}T00:00:00`) - new Date(`${reportFrom}T00:00:00`)) / 86400000 + 1)) }, (_, index) => {
        const date = new Date(`${reportFrom}T00:00:00`);
        date.setDate(date.getDate() + index);
        const key = localDate(date);
        const tx = activeTransactions().filter(item => transactionDate(item) === key);
        const cost = db.expenses.filter(item => item.date === key).reduce((sum, item) => sum + item.amount, 0);
        const revenue = tx.reduce((sum, item) => sum + item.total, 0);
        const hpp = tx.reduce((sum, item) => sum + item.cogs, 0);
        const purchases = db.purchases.filter(item => localDate(new Date(item.timestamp)) === key).reduce((sum, item) => sum + Number(item.total || 0), 0);
        return [key, revenue, hpp, purchases, cost, revenue - hpp - cost, revenue - purchases - cost];
      })]);
    }

    function cancelTransaction(id) {
      const transaction = db.transactions.find(item => item.id === id);
      if (transaction?.isSimulated) return toast('Transaksi simulasi tidak mengubah stok dan tidak dapat dibatalkan sebagai penjualan nyata.', 'warning');
      if (!transaction || transaction.cancelled || !Array.isArray(transaction.consumption) || !transaction.consumption.length) return toast('Transaksi ini tidak memiliki catatan pemakaian stok yang dapat dibalik.', 'error');
      if (!confirm(`Batalkan transaksi ${id}? Nilai penjualan dikeluarkan dari laporan dan stok dikembalikan.`)) return;
      const before = clone(db);
      transaction.consumption.forEach(part => {
        const item = inventoryItem(part.inventoryId);
        if (!item) return;
        const qty = Number(part.qty || 0);
        const returnToDaily = part.source === 'daily' && db.shift.active && db.shift.id === transaction.shiftId && db.shift.dailyStock[item.id];
        if (returnToDaily) {
          db.shift.dailyStock[item.id].available = round3(db.shift.dailyStock[item.id].available + qty);
          recordStockMovement(item, 'daily', qty, 'Pembatalan transaksi', id);
        } else {
          item.stock = round3(item.stock + qty);
          recordStockMovement(item, 'warehouse', qty, 'Pembatalan transaksi', `${id} · dikembalikan ke Gudang Induk`);
        }
      });
      (transaction.lines || []).forEach(line => {
        const menu = menuItem(line.id);
        if (menu) menu.sold = Math.max(0, Number(menu.sold || 0) - lineQuantity(line));
      });
      transaction.cancelled = true;
      transaction.cancelledAt = new Date().toISOString();
      if (!saveDB()) {
        db = before;
        render();
        return;
      }
      render();
      toast(`Transaksi ${id} dibatalkan dan stok dikembalikan.`, 'success');
    }

    function showTransactionReceipt(id) {
      const transaction = db.transactions.find(item => item.id === id);
      if (!transaction) return toast('Transaksi tidak ditemukan.', 'error');
      const payment = transaction.paymentMethod || 'Tunai';
      showModal(`Struk ${escapeHtml(transaction.id)}`, transaction.isSimulated ? 'Contoh transaksi simulasi; bukan penjualan aktual dan tidak mengubah stok.' : 'Bukti transaksi Warung Makan Nusantara.', `
        <div class="receipt-print">
          ${transaction.isSimulated ? '<div class="pill amber" style="display:block;text-align:center;margin-bottom:10px">TRANSAKSI SIMULASI · BUKAN PENJUALAN AKTUAL</div>' : ''}

          <div class="row"><span>No. transaksi</span><strong>${escapeHtml(transaction.id)}</strong></div>
          <div class="row"><span>Waktu</span><strong>${escapeHtml(transaction.date || transactionDate(transaction))} · ${escapeHtml(transaction.time || '—')}</strong></div>
          <div class="row"><span>Kasir</span><strong>${transaction.cashier === 'retail' ? 'Sembako & eceran' : 'Jualan harian'}</strong></div>
          <div class="row"><span>Pembayaran</span><strong>${escapeHtml(payment)}${payment.includes('simulasi') ? ' · konfirmasi manual' : ''}</strong></div>
          <div style="margin:10px 0;border-top:1px dashed var(--line)">${(transaction.lines || []).map(line => `<div class="row"><span>${escapeHtml(line.name)} × ${quantity(line.qty)}</span><strong>${money(Number(line.price) * Number(line.qty))}</strong></div>`).join('')}</div>
          <div class="row"><span>Subtotal</span><strong>${money((transaction.lines || []).reduce((sum, line) => sum + Number(line.price) * Number(line.qty), 0))}</strong></div>
          <div class="row"><span>Diskon</span><strong>− ${money(transaction.discount || 0)}</strong></div>
          <div class="cart-total"><span>Total</span><span>${money(transaction.total)}</span></div>
          ${payment === 'Tunai' && transaction.cashReceived != null ? `<div class="row"><span>Tunai diterima</span><strong>${money(transaction.cashReceived)}</strong></div><div class="row"><span>Kembalian</span><strong>${money(transaction.change || 0)}</strong></div>` : ''}
          ${transaction.cancelled ? '<p class="pill red">TRANSAKSI DIBATALKAN</p>' : ''}
          <p style="text-align:center;color:var(--muted);font-size:10px">Terima kasih telah berkunjung.<br>STOCKLOGIC · Prototype simulasi</p>
        </div>
        <div class="modal-actions"><button class="secondary" onclick="closeModal()">Tutup</button><button class="primary" onclick="window.print()">Cetak struk</button></div>`);
    }

    function openJournalModal(id) {
      const note = db.notes.find(item => item.id === id);
      const current = note || { title: '', body: '', category: 'Operasional', priority: 'Sedang', done: false };
      showModal(note ? 'Ubah catatan' : 'Catatan baru', 'Simpan pengingat, temuan stok, atau tindak lanjut usaha.', `
        <form onsubmit="event.preventDefault();saveJournalNote('${note ? note.id : ''}')"><div class="form-grid">
          <label class="field">Judul<input id="journal-title" maxlength="100" value="${escapeHtml(current.title)}" required></label>
          <label class="field">Kategori<select id="journal-category">${['Operasional', 'Stok', 'Harga', 'Penjualan', 'Keuangan'].map(category => `<option ${current.category === category ? 'selected' : ''}>${category}</option>`).join('')}</select></label>
          <label class="field">Prioritas<select id="journal-priority">${['Rendah', 'Sedang', 'Tinggi'].map(priority => `<option ${current.priority === priority ? 'selected' : ''}>${priority}</option>`).join('')}</select></label>
          <label class="field">Catatan<textarea id="journal-body" rows="4" maxlength="600">${escapeHtml(current.body || '')}</textarea></label>
        </div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Simpan catatan</button></div></form>`);
    }

    function saveJournalNote(id) {
      const title = document.getElementById('journal-title').value.trim();
      if (!title) return toast('Judul catatan wajib diisi.', 'warning');
      const values = { title, body: document.getElementById('journal-body').value.trim(), category: document.getElementById('journal-category').value, priority: document.getElementById('journal-priority').value };
      const note = db.notes.find(item => item.id === id);
      if (note) Object.assign(note, values);
      else db.notes.unshift({ id: `NOTE-${Date.now()}`, ...values, done: false, timestamp: new Date().toISOString() });
      closeModal();
      saveDB();
      render();
      toast('Catatan operasional tersimpan.', 'success');
    }

    function toggleJournalNote(id) {
      const note = db.notes.find(item => item.id === id);
      if (!note) return;
      note.done = !note.done;
      saveDB();
      render();
    }

    function deleteJournalNote(id) {
      if (!confirm('Hapus catatan ini?')) return;
      db.notes = db.notes.filter(item => item.id !== id);
      saveDB();
      render();
    }

    function renderJournal() {
      const notes = db.notes.slice().sort((a, b) => Number(a.done) - Number(b.done) || String(b.timestamp).localeCompare(String(a.timestamp)));
      return `${pageHeading('Catatan Operasional', 'Jurnal untuk temuan, pengingat, dan tindak lanjut harian.', '<button class="primary" onclick="openJournalModal()">＋ &nbsp;Catatan Baru</button>')}
        <div class="card"><div class="card-title"><div><h3>Daftar catatan</h3><p>${notes.filter(note => !note.done).length} belum selesai · ${notes.length} total</p></div><button class="secondary" onclick="db.notifications=!db.notifications;saveDB();render()">${db.notifications ? 'Matikan' : 'Aktifkan'} notifikasi</button></div>
          ${notes.length ? `<div class="list">${notes.map(note => `<div class="journal-item ${note.done ? 'done' : ''}"><input type="checkbox" aria-label="Tandai selesai" ${note.done ? 'checked' : ''} onchange="toggleJournalNote('${escapeHtml(note.id)}')"><div><strong>${escapeHtml(note.title)}</strong> <span class="pill ${note.priority === 'Tinggi' ? 'red' : note.priority === 'Sedang' ? 'amber' : 'green'}">${escapeHtml(note.priority)}</span> <span class="pill">${escapeHtml(note.category)}</span><p>${escapeHtml(note.body || 'Tanpa keterangan.')}</p><small>${formatDate(String(note.timestamp || '').slice(0, 10))}</small></div><div class="table-actions"><button class="ghost" onclick="openJournalModal('${escapeHtml(note.id)}')">Ubah</button><button class="danger" onclick="deleteJournalNote('${escapeHtml(note.id)}')">Hapus</button></div></div>`).join('')}</div>` : '<div class="empty">Belum ada catatan. Tambahkan catatan operasional pertama.</div>'}
        </div>`;
    }

    function saveStoreProfile() {
      const fields = ['name', 'owner', 'address', 'phone', 'category', 'hours'];
      const values = Object.fromEntries(fields.map(field => [field, document.getElementById(`shop-${field}`).value.trim()]));
      if (!values.name || !values.owner) return toast('Nama usaha dan pemilik wajib diisi.', 'error');
      db.shop = values;
      saveDB();
      render();
      toast('Profil usaha tersimpan.', 'success');
    }

    function exportBackup() {
      const url = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'stocklogic_backup.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function validateBackupData(data) {
      if (!data || typeof data !== 'object' || Array.isArray(data) || data.version !== 3) return 'Format backup STOCKLOGIC tidak dikenali.';
      for (const key of ['inventory', 'menus']) {
        if (!Array.isArray(data[key])) return `Bagian ${key} pada backup tidak valid.`;
      }
      for (const key of ['transactions', 'shiftHistory', 'expenses', 'notes', 'stockMovements', 'purchases']) {
        if (data[key] !== undefined && !Array.isArray(data[key])) return `Daftar ${key} pada backup tidak valid.`;
      }
      const inventoryIds = new Set();
      for (const item of data.inventory) {
        const id = Number(item?.id);
        if (!Number.isFinite(id) || inventoryIds.has(id) || !String(item.name || '').trim() || !String(item.unit || '').trim()) return 'ID, nama, atau satuan bahan pada backup tidak valid.';
        if ([item.stock, item.min, item.cost].some(value => !Number.isFinite(Number(value)) || Number(value) < 0)) return `Nilai stok atau biaya bahan ${item.name} tidak valid.`;
        inventoryIds.add(id);
      }
      const menuIds = new Set();
      for (const menu of data.menus) {
        const id = Number(menu?.id);
        if (!Number.isFinite(id) || menuIds.has(id) || !String(menu.name || '').trim() || !Number.isFinite(Number(menu.price)) || Number(menu.price) <= 0 || !Array.isArray(menu.recipe)) return 'ID, harga, atau resep menu pada backup tidak valid.';
        menuIds.add(id);
        for (const part of menu.recipe) {
          if (!inventoryIds.has(Number(part.inventoryId)) || !['daily', 'warehouse'].includes(part.source) || !Number.isFinite(Number(part.qty)) || Number(part.qty) <= 0) return `Resep menu ${menu.name} memiliki referensi bahan atau takaran tidak valid.`;
        }
      }
      for (const transaction of data.transactions || []) {
        if (!transaction || !String(transaction.id || '').trim() || !Number.isFinite(Number(transaction.total)) || !Number.isFinite(Number(transaction.cogs))) return 'Transaksi pada backup memiliki ID atau nilai keuangan tidak valid.';
        if (transaction.lines !== undefined && (!Array.isArray(transaction.lines) || transaction.lines.some(line => !menuIds.has(Number(line.id)) || !Number.isInteger(Number(line.qty)) || Number(line.qty) <= 0 || !Number.isFinite(Number(line.price))))) return `Rincian transaksi ${transaction.id} tidak valid.`;
        if (transaction.consumption !== undefined && (!Array.isArray(transaction.consumption) || transaction.consumption.some(part => !inventoryIds.has(Number(part.inventoryId)) || !['daily', 'warehouse'].includes(part.source) || !Number.isFinite(Number(part.qty)) || Number(part.qty) <= 0))) return `Pemakaian stok transaksi ${transaction.id} tidak valid.`;
      }
      for (const purchase of data.purchases || []) {
        if (!inventoryIds.has(Number(purchase.inventoryId)) || !Number.isFinite(Number(purchase.quantity)) || Number(purchase.quantity) <= 0 || !Number.isFinite(Number(purchase.unitCost)) || Number(purchase.unitCost) < 0) return 'Riwayat pembelian pada backup memiliki referensi atau nilai tidak valid.';
      }
      for (const expense of data.expenses || []) {
        if (!Number.isFinite(Number(expense.amount)) || Number(expense.amount) < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(String(expense.date || ''))) return 'Catatan biaya pada backup memiliki tanggal atau jumlah tidak valid.';
      }
      const shift = data.shift || {};
      if (shift.dailyStock !== undefined && (!shift.dailyStock || typeof shift.dailyStock !== 'object' || Array.isArray(shift.dailyStock) || Object.entries(shift.dailyStock).some(([id, stock]) => !inventoryIds.has(Number(id)) || !stock || [stock.opening, stock.added, stock.available].some(value => !Number.isFinite(Number(value)) || Number(value) < 0)))) return 'Alokasi stok shift pada backup tidak valid.';
      if (data.shop !== undefined && (!data.shop || typeof data.shop !== 'object' || Array.isArray(data.shop))) return 'Profil usaha pada backup tidak valid.';
      return '';
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        event.target.value = '';
        return toast('File backup maksimal 5 MB.', 'warning');
      }
      const reader = new FileReader();
      reader.onerror = () => toast('File backup gagal dibaca.', 'error');
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const validationError = validateBackupData(parsed);
          if (validationError) throw new Error(validationError);
          if (!confirm('Pulihkan backup ini? Data pada browser akan diganti.')) return;
          const previous = db;
          db = { ...clone(DEFAULT_DATA), ...parsed, inventory: expandInventoryCatalog(parsed.inventory), shift: { ...clone(DEFAULT_DATA.shift), ...(parsed.shift || {}) }, expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [], notes: Array.isArray(parsed.notes) ? parsed.notes : [], stockMovements: Array.isArray(parsed.stockMovements) ? parsed.stockMovements : [], purchases: Array.isArray(parsed.purchases) ? parsed.purchases : [], shop: { ...clone(DEFAULT_DATA.shop), ...(parsed.shop || {}) } };
          if (!saveDB()) {
            db = previous;
            return;
          }
          cart = { daily: [], retail: [] };
          posSettings = { daily: { discount: 0, payment: 'Tunai', cashReceived: 0 }, retail: { discount: 0, payment: 'Tunai', cashReceived: 0 } };
          render();
          toast('Backup berhasil dipulihkan.', 'success');
        } catch (error) {
          console.error('Gagal memulihkan backup STOCKLOGIC:', error);
          toast(error.message === 'Format backup tidak dikenali.' ? error.message : 'Backup rusak atau tidak dapat dipulihkan.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function renderSettings() {
      const shop = db.shop || DEFAULT_DATA.shop;
      return `${pageHeading('Pengaturan Toko', 'Kelola profil, notifikasi, dan salinan data lokal.')}
        <section class="grid two-col">
          <article class="card"><div class="card-title"><div><h3>Profil usaha</h3><p>Informasi ditampilkan pada navigasi aplikasi.</p></div></div>
            <div class="form-grid">
              <label class="field">Nama usaha<input id="shop-name" maxlength="80" value="${escapeHtml(shop.name)}" required></label>
              <label class="field">Nama pemilik<input id="shop-owner" maxlength="80" value="${escapeHtml(shop.owner)}" required></label>
              <label class="field">Alamat<input id="shop-address" maxlength="140" value="${escapeHtml(shop.address)}"></label>
              <label class="field">Nomor telepon<input id="shop-phone" maxlength="30" value="${escapeHtml(shop.phone)}"></label>
              <label class="field">Kategori usaha<input id="shop-category" maxlength="60" value="${escapeHtml(shop.category)}"></label>
              <label class="field">Jam operasional<input id="shop-hours" maxlength="60" value="${escapeHtml(shop.hours)}"></label>
            </div><div style="margin-top:14px"><button class="primary" onclick="saveStoreProfile()">Simpan profil</button></div>
          </article>
          <article class="card"><div class="card-title"><div><h3>Notifikasi & data</h3><p>Data aplikasi tersimpan pada browser ini.</p></div></div>
            <label class="row"><span class="row-main"><strong>Notifikasi stok dan kedaluwarsa</strong><small>Tampilkan peringatan pada ringkasan usaha.</small></span><input type="checkbox" ${db.notifications ? 'checked' : ''} onchange="db.notifications=this.checked;saveDB();render()"></label>
            <div class="list" style="margin-top:12px">
              <div class="row"><div class="row-main"><strong>Ekspor backup JSON</strong><small>Salin profil, stok, transaksi, biaya, dan jurnal.</small></div><button class="secondary" onclick="exportBackup()">Unduh JSON</button></div>
              <div class="row"><div class="row-main"><strong>Impor backup JSON</strong><small>Mengganti data lokal dengan backup STOCKLOGIC v3.</small></div><label class="secondary" style="cursor:pointer">Pilih file<input type="file" accept="application/json,.json" onchange="importBackup(event)" hidden></label></div>
              <div class="row"><div class="row-main"><strong>Reset data contoh</strong><small>Menghapus perubahan pada browser ini.</small></div><button class="danger" onclick="confirmReset()">Reset</button></div>
            </div>
            <p class="section-note" style="margin-top:12px">Jangan bagikan file backup kepada pihak yang tidak berwenang. Data tidak disinkronkan ke server.</p>
          </article>
        </section>`;
    }

    function renderGuide() {
      const steps = [
        ['01', 'Mulai shift', 'Buka Ringkasan Usaha, pilih START Shift, masukkan modal awal, lalu alokasikan jumlah bahan dari Gudang Induk. Transfer ini tercatat sebagai pemindahan stok, bukan penjualan.'],
        ['02', 'Layani pesanan harian', 'Buka Kasir 1 untuk menu makanan dan minuman. Checkout memotong Stok Jualan Harian sesuai takaran resep dan mencatat omzet, HPP, serta laba kotor.'],
        ['03', 'Layani sembako & eceran', 'Buka Kasir 2. Produk sembako memotong Gudang Induk secara langsung dan tetap dapat dijual saat shift harian tutup.'],
        ['04', 'Tambah stok saat darurat', 'Di halaman Stok Jualan Harian, tambah bahan dari Gudang Induk. Riwayat mencatat saldo sebelum + jumlah tambahan = saldo sesudah berikut nilai modalnya.'],
        ['05', 'Daftarkan menu dan resep', 'Pilih Daftar Menu & Resep → Tambah Menu Baru. Setiap menu wajib memiliki satu atau lebih bahan, sumber stok, dan takaran per porsi.'],
        ['06', 'Akhiri shift', 'Sisa stok shift yang belum terpakai dikembalikan ke Gudang Induk. Riwayat mencatat transfer, pemakaian, dan stok yang dikembalikan.'],
        ['07', 'Gunakan analisis', 'Prediksi & AI menghitung perkiraan permintaan, saran restock, margin menu, dan risiko kedaluwarsa dari data transaksi serta tanggal kedaluwarsa yang dicatat. Hasilnya simulasi berbasis aturan.'],
        ['08', 'Tutup buku dan simpan data', 'Catat biaya operasional di Laporan Keuangan untuk melihat laba bersih dan BEP. Gunakan Catatan Operasional untuk pengingat, lalu Pengaturan Toko untuk ekspor atau pemulihan backup JSON.']
      ];
      return `${pageHeading('Panduan Operasional', 'Alur kerja singkat untuk menjaga transaksi dan stok tetap akurat.')}
        <section class="grid two-col"><article class="card"><div class="list">${steps.map(([number, title, description]) => `<div class="row" style="align-items:flex-start"><span class="pill" style="font-size:12px">${number}</span><div class="row-main"><strong>${title}</strong><small style="display:block;margin-top:4px;line-height:1.6">${description}</small></div></div>`).join('')}</div></article>
        <article class="card"><div class="card-title"><div><h3>Prinsip STOCKLOGIC</h3><p>Dua kasir, dua sumber stok, satu catatan usaha.</p></div></div><div class="list">
          <div class="row"><div class="row-main"><strong>Kasir 1</strong><small>Menu harian → stok alokasi shift</small></div><span class="pill green">Harian</span></div>
          <div class="row"><div class="row-main"><strong>Kasir 2</strong><small>Sembako / eceran → Gudang Induk</small></div><span class="pill">Eceran</span></div>
          <div class="row"><div class="row-main"><strong>Data lokal</strong><small>Disimpan pada browser perangkat ini</small></div><span class="pill amber">localStorage</span></div>
        </div><p style="margin:14px 0 0;color:var(--muted);font-size:10px">Aplikasi ini berjalan di browser tanpa server. Data berada di perangkat/browser yang digunakan; ekspor atau sinkronisasi antarperangkat belum tersedia.</p></article></section>
        <article class="card" style="margin-top:16px"><div class="card-title"><div><h3>Lima skenario demo</h3><p>Data simulasi historis mencakup transaksi 90 hari terakhir dan ditandai pada dashboard/laporan; gunakan tombol untuk membuka modul awal setiap skenario.</p></div></div>
          <div class="grid two-col">
            <div class="row"><div class="row-main"><strong>1 · Penjualan terintegrasi</strong><small>Aktifkan shift, alokasikan bahan resep, lalu jual 2 Ayam Penyet dan 1 Es Teh Manis. Konfirmasi pembayaran dan cek struk, stok, dashboard, serta laporan.</small></div><button class="secondary" onclick="switchTab('pos');if(!db.shift.active)openStartShiftModal()">Mulai</button></div>
            <div class="row"><div class="row-main"><strong>2 · Pembelian bahan</strong><small>Restock 10 kg Beras di Gudang Induk. Periksa stok, nilai rata-rata tertimbang, riwayat pembelian, dan arus kas.</small></div><button class="secondary" onclick="switchTab('warehouse')">Buka gudang</button></div>
            <div class="row"><div class="row-main"><strong>3 · Peringatan stok</strong><small>Cabai Merah pada data demo berada di bawah minimum. Lihat notifikasi lalu restock sesuai kebutuhan.</small></div><button class="secondary" onclick="switchTab('dashboard')">Lihat peringatan</button></div>
            <div class="row"><div class="row-main"><strong>4 · Delta & Sigma</strong><small>Bandingkan menu berdasarkan volume dan margin; estimasi permintaan dan restock menggunakan aturan statistik yang ditampilkan.</small></div><button class="secondary" onclick="switchTab('intelligence')">Buka analisis</button></div>
            <div class="row"><div class="row-main"><strong>5 · Laporan bulanan</strong><small>Periksa omzet, HPP, laba kotor/bersih, pembelian, biaya, arus kas, lalu ekspor ringkasan atau transaksi ke CSV.</small></div><button class="secondary" onclick="reportFrom=localDate(new Date(Date.now()-29*86400000));reportTo=localDate();switchTab('reports')">Buka laporan</button></div>
          </div>
          <p class="section-note" style="margin:12px 0 0">QRIS dan transfer bank hanya dicatat sebagai simulasi dengan konfirmasi kasir. Aplikasi bukan layanan produksi dan tidak memverifikasi pembayaran eksternal.</p>
        </article>`;
    }

    function showModal(title, subtitle, content) {
      const host = document.getElementById('modal-root');
      host.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h3 id="modal-title">${escapeHtml(title)}</h3><p>${escapeHtml(subtitle)}</p></div><button class="modal-close" onclick="closeModal()" aria-label="Tutup">×</button></div>${content}</section></div>`;
      host.querySelector('.modal').focus();
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function confirmReset() {
      if (!confirm('Reset data STOCKLOGIC ke data contoh? Semua transaksi, menu, dan stok pada browser ini akan dihapus.')) return;
      const previous = db;
      db = createDemoData();
      cart = { daily: [], retail: [] };
      posSettings = { daily: { discount: 0, payment: 'Tunai', cashReceived: 0 }, retail: { discount: 0, payment: 'Tunai', cashReceived: 0 } };
      if (!saveDB()) {
        db = previous;
        return;
      }
      toast('Data contoh berhasil dipulihkan.', 'success');
      switchTab('dashboard');
    }

    document.querySelectorAll('.nav button').forEach(button => button.addEventListener('click', () => switchTab(button.dataset.tab)));
    window.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    db = loadDB();
    const dataBeforeDemoHistory = clone(db);
    const demoTransactionsAdded = appendDemoHistory(db);
    if (!saveDB() && demoTransactionsAdded) db = dataBeforeDemoHistory;
    if (demoTransactionsAdded) toast(`${demoTransactionsAdded} transaksi contoh dari 90 hari ditambahkan. Data simulasi ditandai dan tidak mengubah stok.`, 'info');
    render();
  </script>
</body>
</html>
