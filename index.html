            ${last.length ? `<div class="list">${last.map(transactionRow).join('')}</div>` : '<div class="empty">Belum ada transaksi. Selesaikan penjualan pertama untuk mulai melihat ringkasan.</div>'}
          </article>
          <article class="card"><div class="card-title"><div><h3>Ringkasan persediaan</h3><p>Pantau saldo dua sumber stok.</p></div><span class="pill green">Live</span></div>
            <div class="list">
              <div class="row"><div class="row-main"><strong>Gudang Induk</strong><small>Persediaan sembako & bahan baku</small></div><div class="row-side"><strong>${db.inventory.length} item</strong><small>${low ? `${low} perlu restock` : 'Semua aman'}</small></div></div>
              <div class="row"><div class="row-main"><strong>Stok Jualan Harian</strong><small>${db.shift.active ? 'Teralokasi untuk shift aktif' : 'Belum ada alokasi aktif'}</small></div><div class="row-side"><strong>${db.shift.active ? Object.keys(db.shift.dailyStock).length : 0} item</strong><small>${db.shift.active ? 'Penjualan realtime' : 'Menunggu shift'}</small></div></div>
            </div><button class="secondary" style="width:100%;margin-top:13px" onclick="switchTab('warehouse')">Kelola Gudang Induk</button>
          </article>
        </section>`;
    }

    function transactionRow(transaction) {
      const register = transaction.cashier === 'retail' ? 'Kasir 2 · Sembako' : 'Kasir 1 · Harian';
      return `<div class="row"><div class="row-main"><strong>${escapeHtml(transaction.items)} ${transaction.isSimulated ? '<span class="pill amber">SIMULASI</span>' : ''}</strong><small>${escapeHtml(transaction.id)} · ${escapeHtml(transaction.date || transactionDate(transaction))} ${escapeHtml(transaction.time || '—')} · ${register} · ${escapeHtml(transaction.paymentMethod || 'Tunai')}${transaction.cancelled ? ' · DIBATALKAN' : ''}</small></div><div class="row-side"><strong>${money(transaction.total)}</strong><small>${transaction.cancelled ? 'Transaksi dibatalkan' : `Laba ${money(transaction.profit)}`}</small></div></div>`;
    }

    function renderPOS(cashier) {
      const isRetail = cashier === 'retail';
      const items = db.menus.filter(item => isRetail ? item.category === 'Sembako' : item.category !== 'Sembako');
      const currentCart = cart[cashier];
      const settings = posSettings[cashier];
      const subtotal = currentCart.reduce((sum, line) => sum + line.price * line.qty, 0);
      const discount = Math.round(subtotal * settings.discount / 100);
      const total = subtotal - discount;
      const enabled = isRetail || db.shift.active;
      const categories = [...new Set(items.map(item => item.category))];
      return `
        ${pageHeading(isRetail ? 'Kasir 2 · Sembako & Eceran' : 'Kasir 1 · Jualan Harian', isRetail ? 'Barang sembako dan eceran mengurangi stok langsung dari Gudang Induk.' : 'Menu makanan & minuman mengurangi alokasi Stok Jualan Harian shift aktif.', isRetail ? '<span class="pill">Sumber stok: Gudang Induk</span>' : `<span class="pill ${db.shift.active ? 'green' : 'amber'}">${db.shift.active ? 'Shift aktif' : 'Shift belum dimulai'}</span>`)}
        <div class="split-banner">
          <article class="source-card"><div class="source-icon">${isRetail ? '🏬' : '🍽️'}</div><div><h3>${isRetail ? 'Sumber stok: Gudang Induk Sembako' : 'Sumber stok: Stok Jualan Harian'}</h3><p>${isRetail ? 'Penjualan langsung memotong persediaan induk.' : db.shift.active ? 'Stok menu aktif tersedia dan akan dipotong saat checkout.' : 'Mulai shift dan alokasikan bahan sebelum menerima pesanan.'}</p></div></article>
          <div class="tabs"><button class="${isRetail ? '' : 'active'}" onclick="switchTab('pos')">Kasir 1 · Harian</button><button class="${isRetail ? 'active' : ''}" onclick="switchTab('retail')">Kasir 2 · Sembako</button></div>
        </div>
        ${!enabled ? `<div class="card" style="margin-bottom:16px;border-color:#fde68a;background:#fffbeb"><strong style="color:#92400e">Kasir Harian belum dapat digunakan.</strong><p style="margin:5px 0 12px;color:#92400e;font-size:11px">Mulai shift dan alokasikan stok jualan harian terlebih dahulu.</p><button class="primary" onclick="openStartShiftModal()">▶ &nbsp;Mulai Shift</button></div>` : ''}
        <div class="pos-layout">
          <article class="card"><div class="card-title"><div><h3>${isRetail ? 'Katalog sembako & eceran' : 'Menu jualan siap saji'}</h3><p>${items.length} produk terdaftar · wajib memiliki resep stok aktif</p></div><button class="ghost" onclick="switchTab('menu')">Atur menu & resep →</button></div>
            ${items.length ? `<div class="filter-row"><label class="field">Cari produk<input id="pos-search-${cashier}" type="search" placeholder="Nama produk…" oninput="filterPOS('${cashier}')"></label><label class="field">Kategori<select id="pos-category-${cashier}" onchange="filterPOS('${cashier}')"><option value="">Semua kategori</option>${categories.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('')}</select></label></div><div class="pos-products">${items.map(item => {
              const status = stockForMenu(item);
              return `<button class="product" data-pos-product data-name="${escapeHtml(item.name.toLowerCase())}" data-category="${escapeHtml(item.category)}" ${!enabled || !status.available ? 'disabled' : ''} onclick="addToCart('${cashier}',${item.id})"><span class="stock-tag">${status.available ? `Tersedia ${quantity(status.minimum)}+` : 'Stok habis'}</span>${renderCover(item.cover, item.emoji, 'product-cover')}<strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.category)} · ${item.recipe.length} bahan resep</small><b>${money(item.price)}</b></button>`;
            }).join('')}</div>` : '<div class="empty">Belum ada produk pada kasir ini. Tambahkan menu dengan resep di Daftar Menu & Resep.</div>'}
          </article>
          <article class="card cart-card"><div class="card-title"><div><h3>Keranjang transaksi</h3><p>${isRetail ? 'Kasir 2 · saldo Gudang Induk' : 'Kasir 1 · saldo stok shift'}</p></div><button class="ghost" onclick="clearCart('${cashier}')">Kosongkan</button></div>
            ${currentCart.length ? `<div class="cart-lines">${currentCart.map((line, index) => `<div class="cart-line"><div><strong>${escapeHtml(line.name)}</strong><small>${money(line.price)} · subtotal ${money(line.price * line.qty)}</small></div><div class="qty-control"><button onclick="changeCartQty('${cashier}',${index},-1)" aria-label="Kurangi">−</button><b>${line.qty}</b><button onclick="changeCartQty('${cashier}',${index},1)" aria-label="Tambah">+</button></div></div>`).join('')}</div>` : '<div class="empty">Keranjang masih kosong.<br>Pilih produk untuk memulai transaksi.</div>'}
            <div class="form-grid" style="margin-top:12px">
              <label class="field">Diskon (%)<input type="number" min="0" max="100" step="1" value="${settings.discount}" onchange="updatePOSSetting('${cashier}','discount',this.value)"></label>
              <label class="field">Metode pembayaran<select onchange="updatePOSSetting('${cashier}','payment',this.value)"><option value="Tunai" ${settings.payment === 'Tunai' ? 'selected' : ''}>Tunai</option><option value="QRIS (simulasi)" ${settings.payment === 'QRIS (simulasi)' ? 'selected' : ''}>QRIS · simulasi</option><option value="Transfer bank (simulasi)" ${settings.payment === 'Transfer bank (simulasi)' ? 'selected' : ''}>Transfer bank · simulasi</option></select></label>
            </div>
            <div class="row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>
            <div class="row"><span>Diskon</span><strong>− ${money(discount)}</strong></div>
            <div class="cart-total"><span>Total pembayaran</span><span>${money(total)}</span></div>
            <p class="section-note">${settings.payment === 'Tunai' ? 'Pembayaran tunai akan dicatat setelah kasir mengonfirmasi penerimaan uang.' : `${settings.payment} dicatat setelah konfirmasi manual kasir; tidak terhubung ke payment gateway.`}</p>
            <button class="primary" style="width:100%" ${!currentCart.length || !enabled ? 'disabled' : ''} onclick="checkout('${cashier}')">✓ &nbsp;Selesaikan transaksi</button>
            <p style="margin:10px 0 0;color:var(--muted);font-size:10px">Stok akan divalidasi dan dipotong hanya setelah transaksi berhasil.</p>
          </article>
        </div>`;
    }

    function filterPOS(cashier) {
      const search = document.getElementById(`pos-search-${cashier}`)?.value.trim().toLocaleLowerCase('id-ID') || '';
      const category = document.getElementById(`pos-category-${cashier}`)?.value || '';
      document.querySelectorAll('[data-pos-product]').forEach(product => {
        product.hidden = !product.dataset.name.includes(search) || Boolean(category && product.dataset.category !== category);
      });
    }

    function updatePOSSetting(cashier, key, value) {
      if (!posSettings[cashier]) return;
      if (key === 'discount') {
        const discount = Number(value);
        if (!Number.isFinite(discount) || discount < 0 || discount > 100) {
          toast('Diskon harus berada di antara 0% dan 100%.', 'error');
          return render();
        }
        posSettings[cashier].discount = discount;
      } else if (key === 'payment' && ['Tunai', 'QRIS (simulasi)', 'Transfer bank (simulasi)'].includes(value)) {
        posSettings[cashier].payment = value;
      }
      render();
    }

    function stockForMenu(menu) {
      let minimum = Infinity;
      for (const recipe of menu.recipe || []) {
        const item = inventoryItem(recipe.inventoryId);
        if (!item || Number(recipe.qty) <= 0) return { available: false, minimum: 0 };
        minimum = Math.min(minimum, Math.floor(availableStock(item, recipe.source) / Number(recipe.qty)));
      }
      return { available: minimum > 0, minimum: Number.isFinite(minimum) ? minimum : 0 };
    }

    function addToCart(cashier, id) {
      const item = menuItem(id);
      if (!item || !item.recipe?.length) return toast('Produk tidak memiliki resep bahan yang valid.', 'error');
      if (cashier === 'daily' && !db.shift.active) return toast('Mulai shift sebelum menggunakan Kasir Jualan Harian.', 'warning');
      const line = cart[cashier].find(entry => entry.id === item.id);
      if (line) line.qty += 1;
      else cart[cashier].push({ id: item.id, name: item.name, price: Number(item.price), qty: 1 });
      render();
    }

    function changeCartQty(cashier, index, delta) {
      const line = cart[cashier][index];
      if (!line) return;
      line.qty += delta;
      if (line.qty <= 0) cart[cashier].splice(index, 1);
      render();
    }

    function clearCart(cashier) {
      cart[cashier] = [];
      render();
    }

    function cartRequirements(cashier) {
      const lines = cart[cashier];
      if (!lines.length) return { error: 'Keranjang masih kosong.' };
      if (cashier === 'daily' && !db.shift.active) return { error: 'Shift harus aktif untuk menjual menu harian.' };
      const requirements = new Map();
      for (const line of lines) {
        const menu = menuItem(line.id);
        if (!Number.isInteger(line.qty) || line.qty <= 0 || !Number.isFinite(line.price) || line.price <= 0) return { error: `Jumlah atau harga ${line.name} tidak valid.` };
        if (!menu || !menu.recipe?.length) return { error: `Resep ${line.name} tidak tersedia. Transaksi dibatalkan.` };
        for (const part of menu.recipe) {
          const item = inventoryItem(part.inventoryId);
          const source = part.source;
          if (!item || !['daily', 'warehouse'].includes(source) || !Number.isFinite(Number(part.qty)) || !(Number(part.qty) > 0)) return { error: `Resep ${line.name} memiliki bahan yang tidak valid.` };
          if ((cashier === 'daily' && menu.category === 'Sembako') || (cashier === 'retail' && menu.category !== 'Sembako')) return { error: 'Produk berada di kasir yang salah. Transaksi dibatalkan.' };
          const key = `${source}:${item.id}`;
          const current = requirements.get(key) || { source, item, qty: 0 };
          current.qty += Number(part.qty) * line.qty;
          requirements.set(key, current);
        }
      }
      for (const need of requirements.values()) {
        const available = availableStock(need.item, need.source);
        if (available + 1e-9 < need.qty) {
          const sourceName = need.source === 'daily' ? 'Stok Jualan Harian' : 'Gudang Induk';
          return { error: `${sourceName} · ${need.item.name} kurang. Butuh ${quantity(need.qty)} ${need.item.unit}, tersedia ${quantity(available)}.` };
        }
      }
      return { lines, requirements };
    }

    function checkout(cashier) {
      const validated = cartRequirements(cashier);
      if (validated.error) return toast(validated.error, 'error');
      const subtotal = validated.lines.reduce((sum, line) => sum + line.price * line.qty, 0);
      const discountAmount = Math.round(subtotal * posSettings[cashier].discount / 100);
      const total = subtotal - discountAmount;
      const payment = posSettings[cashier].payment;
      const cashReceived = Math.max(total, Number(posSettings[cashier].cashReceived) || 0);
      posSettings[cashier].cashReceived = cashReceived;
      const cashField = payment === 'Tunai'
        ? `<label class="field">Uang diterima (Rp)<input id="checkout-cash-received" type="number" min="${total}" step="1" value="${cashReceived}" required oninput="updateCashChange(${total})"></label><div class="row"><span>Kembalian</span><strong id="checkout-change">${money(cashReceived - total)}</strong></div>`
        : `<div class="alert-item">${payment} adalah simulasi. Pastikan kasir menerima konfirmasi pembayaran secara manual; tidak ada verifikasi bank atau payment gateway.</div>`;
      showModal('Konfirmasi pembayaran', 'Periksa total dan metode pembayaran sebelum menyimpan transaksi.', `
        <div class="list"><div class="row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="row"><span>Diskon (${posSettings[cashier].discount}%)</span><strong>− ${money(discountAmount)}</strong></div><div class="row"><span>Total dibayar</span><strong>${money(total)}</strong></div><div class="row"><span>Metode</span><strong>${escapeHtml(payment)}</strong></div></div>
        <div style="margin-top:14px">${cashField}</div>
        <div class="modal-actions"><button class="secondary" onclick="closeModal()">Kembali</button><button class="primary" onclick="completeCheckout('${cashier}')">Konfirmasi & simpan</button></div>`);
    }

    function updateCashChange(total) {
      const received = Number(document.getElementById('checkout-cash-received')?.value) || 0;
      const change = document.getElementById('checkout-change');
      if (change) change.textContent = money(Math.max(0, received - total));
    }

    let checkoutInProgress = false;
    function completeCheckout(cashier) {
      if (checkoutInProgress) return;
      const validated = cartRequirements(cashier);
      if (validated.error) return toast(validated.error, 'error');
      const { lines, requirements } = validated;
      const payment = posSettings[cashier].payment;
      const subtotal = lines.reduce((sum, line) => sum + line.price * line.qty, 0);
      const discountRate = Number(posSettings[cashier].discount) || 0;
      const discount = Math.round(subtotal * discountRate / 100);
      const total = subtotal - discount;
      const cashReceived = payment === 'Tunai' ? Number(document.getElementById('checkout-cash-received')?.value) : total;
      if (payment === 'Tunai' && (!Number.isFinite(cashReceived) || cashReceived < total)) return toast('Uang diterima harus sama dengan atau lebih besar dari total pembayaran.', 'error');
      const before = clone(db);
      checkoutInProgress = true;
      let cogs = 0;
      const consumption = [];
      for (const need of requirements.values()) {
        if (need.source === 'daily') {
          db.shift.dailyStock[need.item.id].available = round3(db.shift.dailyStock[need.item.id].available - need.qty);
        } else {
          need.item.stock = round3(need.item.stock - need.qty);
        }
        recordStockMovement(need.item, need.source, -need.qty, 'Penjualan', lines.map(line => line.name).join(', '));
        consumption.push({ inventoryId: need.item.id, source: need.source, qty: round3(need.qty) });
        cogs += need.qty * Number(need.item.cost || 0);
      }
      const now = new Date();
      let sequence = Math.max(1, Number(db.nextTransactionSequence) || 1);
      let id = `TRX-${String(sequence).padStart(6, '0')}`;
      while (db.transactions.some(transaction => transaction.id === id)) id = `TRX-${String(++sequence).padStart(6, '0')}`;
      db.nextTransactionSequence = sequence + 1;
      const transaction = {
        id,
        cashier,
        timestamp: now.toISOString(),
        date: localDate(now),
        time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        items: lines.map(line => `${line.name} (${line.qty})`).join(', '),
        lines: lines.map(line => ({ ...line })),
        consumption,
        shiftId: cashier === 'daily' ? db.shift.id : null,
        discount,
        paymentMethod: payment,
        paymentStatus: 'Dikonfirmasi manual',
        cashReceived: payment === 'Tunai' ? cashReceived : null,
        change: payment === 'Tunai' ? cashReceived - total : 0,
        status: 'Selesai',
        total,
        cogs: round2(cogs),
        profit: round2(total - cogs)
      };
      lines.forEach(line => { const item = menuItem(line.id); if (item) item.sold = (Number(item.sold) || 0) + line.qty; });
      db.transactions.unshift(transaction);
      if (!saveDB()) {
        db = before;
        checkoutInProgress = false;
        render();
        return;
      }
      cart[cashier] = [];
      posSettings[cashier].discount = 0;
      posSettings[cashier].cashReceived = 0;
      checkoutInProgress = false;
      closeModal();
      render();
      toast(`Transaksi ${id} berhasil · ${money(total)} · HPP ${money(cogs)} tercatat.`, 'success');
      showTransactionReceipt(id);
    }

    function round3(value) { return Number(Number(value).toFixed(3)); }
    function round2(value) { return Number(Number(value).toFixed(2)); }

    function openStartShiftModal() {
      if (db.shift.active) return toast('Shift sudah aktif.', 'info');
      const stockRows = db.inventory.map(item => `<label class="row" style="cursor:pointer"><span class="row-main"><strong>${escapeHtml(item.name)}</strong><small>Gudang tersedia ${quantity(item.stock)} ${escapeHtml(item.unit)}</small></span><span style="display:flex;align-items:center;gap:7px"><input aria-label="Alokasi ${escapeHtml(item.name)}" type="number" min="0" max="${item.stock}" step="0.001" value="0" data-allocation="${item.id}" style="width:94px;padding:8px;border:1px solid var(--line);border-radius:8px"><small>${escapeHtml(item.unit)}</small></span></label>`).join('');
      showModal('Mulai shift & alokasikan stok', 'Tentukan bahan yang dipindahkan dari Gudang Induk ke stok jualan hari ini.', `
        <div class="field" style="margin-bottom:12px">Modal awal kas / uang kembalian (Rp)<input id="shift-cash" type="number" min="0" step="1000" value="100000" required></div>
        <div class="list" style="max-height:47vh;overflow:auto">${stockRows}</div>
        <div class="modal-actions"><button class="secondary" onclick="closeModal()">Batal</button><button class="primary" onclick="startShift()">▶ &nbsp;Mulai shift</button></div>`);
    }

    function startShift() {
      const cash = Number(document.getElementById('shift-cash').value);
      if (!Number.isFinite(cash) || cash < 0) return toast('Modal awal harus berupa angka nol atau lebih.', 'error');
      const allocations = {};
      let hasAllocation = false;
      for (const input of document.querySelectorAll('[data-allocation]')) {
        const item = inventoryItem(input.dataset.allocation);
        const qty = Number(input.value);
        if (!Number.isFinite(qty) || qty < 0) return toast(`Alokasi ${item.name} tidak valid.`, 'error');
        if (qty > item.stock + 1e-9) return toast(`Stok gudang ${item.name} tidak cukup untuk alokasi.`, 'error');
        if (qty > 0) { allocations[item.id] = { opening: round3(qty), added: 0, available: round3(qty) }; hasAllocation = true; }
      }
      if (!hasAllocation) return toast('Alokasikan minimal satu bahan untuk memulai shift.', 'warning');
      const before = clone(db);
      for (const [id, stock] of Object.entries(allocations)) {
        const item = inventoryItem(id);
        item.stock = round3(item.stock - stock.opening);
        recordStockMovement(item, 'warehouse', -stock.opening, 'Alokasi shift', 'Transfer ke stok jualan harian');
        recordStockMovement(item, 'daily', stock.opening, 'Alokasi shift', 'Transfer dari Gudang Induk');
      }
      const now = new Date();
      db.shift = { active: true, id: `SHIFT-${localDate(now)}-${now.getTime().toString().slice(-4)}`, startedAt: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), startedISO: now.toISOString(), date: localDate(now), initialCash: cash, dailyStock: allocations, additions: [], closedAt: null };
      if (!saveDB()) {
        db = before;
        render();
        return;
      }
      closeModal();
      toast('Shift aktif. Alokasi stok sudah dipindahkan dari Gudang Induk.', 'success');
      switchTab('dashboard');
    }

    function stopShift() {
      if (!db.shift.active) return;
      const remaining = Object.values(db.shift.dailyStock).reduce((sum, item) => sum + Number(item.available || 0), 0);
      if (!confirm(`Akhiri shift? Sisa stok jualan (${quantity(remaining)} unit) akan dikembalikan ke Gudang Induk dan tercatat.`)) return;
      const before = clone(db);
      const now = new Date();
      for (const [id, daily] of Object.entries(db.shift.dailyStock)) {
        const item = inventoryItem(id);
        if (item) {
          const returned = Number(daily.available || 0);
          if (returned > 0) {
            item.stock = round3(item.stock + returned);
            recordStockMovement(item, 'daily', -returned, 'Penutupan shift', 'Sisa stok dikembalikan ke Gudang Induk');
            recordStockMovement(item, 'warehouse', returned, 'Penutupan shift', 'Sisa stok dari shift');
          }
        }
      }
      const shiftTransactions = activeTransactions().filter(item => !item.isSimulated && item.date === db.shift.date && item.timestamp >= (db.shift.startedISO || ''));
      db.shiftHistory.unshift({
        id: db.shift.id, date: db.shift.date, startedAt: db.shift.startedAt, closedAt: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        initialCash: db.shift.initialCash, transactions: shiftTransactions.length,
        revenue: shiftTransactions.filter(item => item.cashier === 'daily').reduce((sum, item) => sum + item.total, 0),
        returned: Object.fromEntries(Object.entries(db.shift.dailyStock).map(([id, stock]) => [id, Number(stock.available || 0)])),
        additions: db.shift.additions
      });
      db.shift.active = false;
      db.shift.closedAt = now.toISOString();
      Object.values(db.shift.dailyStock).forEach(item => { item.available = 0; });
      if (!saveDB()) {
        db = before;
        render();
        return;
      }
      toast('Shift selesai. Sisa stok harian dikembalikan ke Gudang Induk.', 'success');
      render();
    }

    function renderShiftStock() {
      const action = db.shift.active ? '<button class="primary" onclick="openEmergencyStockModal()">＋ &nbsp;Tambah Stok Darurat</button>' : '<button class="primary" onclick="openStartShiftModal()">▶ &nbsp;Mulai Shift & Alokasi</button>';
      const rows = Object.entries(db.shift.dailyStock || {}).map(([id, stock]) => {
        const item = inventoryItem(id);
        if (!item) return '';
        const percentage = stock.opening + stock.added > 0 ? Math.max(0, Math.min(100, stock.available / (stock.opening + stock.added) * 100)) : 0;
        return `<tr><td class="table-name">${escapeHtml(item.name)}</td><td>${quantity(stock.opening)} ${escapeHtml(item.unit)}</td><td>${quantity(stock.added)} ${escapeHtml(item.unit)}</td><td><strong>${quantity(stock.available)} ${escapeHtml(item.unit)}</strong><div style="width:110px;height:4px;margin-top:6px;border-radius:4px;background:#e2e8f0"><div style="width:${percentage}%;height:4px;border-radius:4px;background:${percentage < 20 ? '#ef4444' : '#1677C8'}"></div></div></td><td><span class="pill ${stock.available <= item.min ? 'red' : 'green'}">${stock.available <= item.min ? 'Menipis' : 'Tersedia'}</span></td></tr>`;
      }).join('');
      const additions = db.shift.additions || [];
      return `${pageHeading('Stok Jualan Harian', db.shift.active ? `Shift aktif sejak ${escapeHtml(db.shift.startedAt)} · alokasi hanya berlaku hari ini.` : 'Mulai shift untuk memindahkan persediaan dari Gudang Induk.', action)}
        <div class="split-banner"><article class="source-card"><div class="source-icon">◷</div><div><h3>${db.shift.active ? 'Shift berjalan' : 'Tidak ada shift aktif'}</h3><p>${db.shift.active ? 'Kasir Harian memotong stok ini secara real-time.' : 'Stok harian tidak bisa dijual ketika toko tutup.'}</p></div><span class="pill ${db.shift.active ? 'green' : 'amber'}" style="margin-left:auto">${db.shift.active ? 'AKTIF' : 'NONAKTIF'}</span></article><article class="source-card"><div class="source-icon">↔</div><div><h3>Transfer stok tercatat</h3><p>Alokasi dan sisa shift direkonsiliasi ke Gudang Induk.</p></div></article></div>
        <article class="card"><div class="card-title"><div><h3>Saldo alokasi shift</h3><p>Stok awal + stok darurat − pemakaian resep = sisa tersedia.</p></div>${db.shift.active ? `<span class="pill green">${Object.keys(db.shift.dailyStock).length} bahan aktif</span>` : ''}</div>
          ${rows ? `<div class="table-wrap"><table><thead><tr><th>Bahan</th><th>Alokasi awal</th><th>Tambah darurat</th><th>Sisa tersedia</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">Belum ada alokasi stok pada shift ini. Mulai shift dengan memilih bahan dan jumlahnya.</div>'}
        </article>
        <article class="card" style="margin-top:16px"><div class="card-title"><div><h3>Riwayat penambahan darurat</h3><p>Jejak stok transparan untuk rekonsiliasi modal dan laporan.</p></div><span class="pill">${additions.length} catatan</span></div>
          ${additions.length ? `<div class="list">${additions.slice().reverse().map(entry => { const item = inventoryItem(entry.inventoryId); return `<div class="row"><div class="row-main"><strong>${escapeHtml(item?.name || 'Bahan')} · ${quantity(entry.before)} + ${quantity(entry.qty)} ${escapeHtml(item?.unit || '')} = ${quantity(entry.after)} ${escapeHtml(item?.unit || '')}</strong><small>${escapeHtml(entry.time)} · dipindahkan dari Gudang Induk</small></div><div class="row-side"><strong>${money(entry.cost)}</strong><small>nilai modal tambahan</small></div></div>`; }).join('')}</div>` : '<div class="empty">Belum ada tambahan darurat. Setiap penambahan mencatat stok sebelum, jumlah tambahan, stok sesudah, dan modal.</div>'}
        </article>`;
    }

    function openEmergencyStockModal() {
      if (!db.shift.active) return toast('Mulai shift sebelum menambah stok jualan harian.', 'warning');
      const options = db.inventory.map(item => `<option value="${item.id}">${escapeHtml(item.name)} · gudang ${quantity(item.stock)} ${escapeHtml(item.unit)} · sisa shift ${quantity(db.shift.dailyStock[item.id]?.available || 0)} ${escapeHtml(item.unit)}</option>`).join('');
      showModal('Tambah stok darurat', 'Jumlah dipindahkan dari Gudang Induk. Perubahan saldo dan nilai modal dicatat otomatis.', `
        <form id="emergency-form" onsubmit="event.preventDefault();addEmergencyStock()"><div class="form-grid">
          <label class="field">Bahan baku<select id="emergency-item" required>${options}</select></label>
          <label class="field">Jumlah tambahan<input id="emergency-qty" type="number" min="0.001" step="0.001" placeholder="Contoh: 4" required></label>
        </div><p id="emergency-cost-preview" class="section-note" style="margin-top:12px">Jumlah dan nilai modal akan tercatat di riwayat shift.</p>
        <div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary" type="submit">＋ &nbsp;Tambah stok</button></div></form>`);
      document.getElementById('emergency-item').addEventListener('change', updateEmergencyPreview);
      document.getElementById('emergency-qty').addEventListener('input', updateEmergencyPreview);
      updateEmergencyPreview();
    }

    function updateEmergencyPreview() {
      const item = inventoryItem(document.getElementById('emergency-item')?.value);
      const qty = Number(document.getElementById('emergency-qty')?.value) || 0;
      const preview = document.getElementById('emergency-cost-preview');
      if (item && preview) preview.textContent = `Nilai modal tambahan: ${money(qty * item.cost)} · Gudang tersedia ${quantity(item.stock)} ${item.unit}.`;
    }

    function addEmergencyStock() {
      const item = inventoryItem(document.getElementById('emergency-item').value);
      const amount = Number(document.getElementById('emergency-qty').value);
      if (!db.shift.active || !item || !Number.isFinite(amount) || amount <= 0) return toast('Pilih bahan dan jumlah tambahan yang valid.', 'error');
      if (item.stock + 1e-9 < amount) return toast(`Gudang Induk ${item.name} hanya memiliki ${quantity(item.stock)} ${item.unit}.`, 'error');
      const beforeState = clone(db);
      const record = db.shift.dailyStock[item.id] || { opening: 0, added: 0, available: 0 };
      const before = Number(record.available || 0);
      record.added = round3(Number(record.added || 0) + amount);
      record.available = round3(before + amount);
      db.shift.dailyStock[item.id] = record;
      item.stock = round3(item.stock - amount);
      recordStockMovement(item, 'warehouse', -amount, 'Stok darurat', 'Dipindahkan ke stok jualan harian');
      recordStockMovement(item, 'daily', amount, 'Stok darurat', 'Tambahan stok untuk shift aktif');
      db.shift.additions.push({ inventoryId: item.id, before, qty: round3(amount), after: record.available, cost: round2(amount * item.cost), time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) });
      if (!saveDB()) {
        db = beforeState;
        render();
        return;
      }
      closeModal();
      toast(`Stok ${item.name}: ${quantity(before)} + ${quantity(amount)} ${item.unit} tercatat.`, 'success');
      render();
    }

    function renderWarehouse() {
      const rows = db.inventory.map(item => `<tr data-inventory-row data-search="${escapeHtml(`${item.name} ${item.unit}`.toLowerCase())}"><td class="table-name">${escapeHtml(item.name)}</td><td><strong>${quantity(item.stock)} ${escapeHtml(item.unit)}</strong></td><td>${quantity(item.min)} ${escapeHtml(item.unit)}</td><td>${money(item.cost)} / ${escapeHtml(item.unit)}</td><td>${item.expiryDate ? escapeHtml(item.expiryDate) : '—'}</td><td><span class="pill ${item.stock <= item.min ? 'red' : 'green'}">${item.stock <= item.min ? 'Perlu restock' : 'Aman'}</span></td><td><div class="table-actions"><button class="secondary" onclick="openRestockModal(${item.id})">＋ Restock</button><button class="ghost" onclick="openInventoryModal(${item.id})">Ubah</button><button class="ghost" onclick="openInventoryAdjustmentModal(${item.id})">Opname</button></div></td></tr>`).join('');
      const purchases = db.purchases.reduce((sum, purchase) => sum + Number(purchase.total || 0), 0);
      return `${pageHeading('Gudang Induk Sembako', 'Persediaan induk untuk barang eceran, bahan resep, dan alokasi stok jualan harian.', '<button class="primary" onclick="openInventoryModal()">＋ &nbsp;Tambah Barang</button>')}
        <div class="grid stats" style="margin-top:0">${statCard('Jenis persediaan', db.inventory.length, 'Bahan, bumbu, minuman & kemasan', '▦')}${statCard('Nilai persediaan', money(db.inventory.reduce((sum, item) => sum + item.stock * item.cost, 0)), 'Nilai modal berdasarkan stok tersisa', '◈', 'cyan')}${statCard('Perlu restock', db.inventory.filter(item => item.stock <= item.min).length, 'Saldo mencapai batas minimum', '⚑', 'amber')}${statCard('Riwayat pembelian', db.purchases.length, `Total ${money(purchases)}`, '▤', 'green')}</div>
        <article class="card"><div class="card-title"><div><h3>Riwayat pembelian persediaan</h3><p>Setiap restock menyimpan tanggal, barang, jumlah, harga, total, dan pemasok.</p></div><button class="secondary" onclick="exportPurchasesCsv()">Unduh CSV</button></div>${renderPurchaseHistoryTable()}</article>
        <article class="card" style="margin-top:16px"><div class="card-title"><div><h3>Daftar persediaan induk</h3><p>Kasir 2 memotong stok langsung. Alokasi kasir 1 mengurangi stok ini saat shift dimulai.</p></div><label class="field" style="max-width:260px;margin:0">Cari bahan<input id="warehouse-search" type="search" value="${escapeHtml(warehouseSearch)}" placeholder="Nama bahan atau satuan" oninput="filterWarehouseItems(this.value)"></label></div><div id="inventory-filter-count" class="section-note" style="margin:0 0 10px">${db.inventory.length} jenis persediaan</div><div class="table-wrap"><table><thead><tr><th>Nama bahan</th><th>Stok saat ini</th><th>Batas minimum</th><th>Harga pokok / unit</th><th>Kedaluwarsa</th><th>Status</th><th style="text-align:right">Aksi</th></tr></thead><tbody>${rows}</tbody></table></div></article>
        <article class="card" style="margin-top:16px"><div class="card-title"><div><h3>Riwayat pergerakan stok</h3><p>Transfer, penjualan, restock, dan pengembalian terakhir.</p></div></div>${renderStockMovementTable()}</article>`;
    }

    function filterWarehouseItems(query) {
      warehouseSearch = query;
      const normalized = query.trim().toLocaleLowerCase('id-ID');
      const rows = [...document.querySelectorAll('[data-inventory-row]')];
      let visible = 0;
      rows.forEach(row => {
        const matches = !normalized || row.dataset.search.includes(normalized);
        row.hidden = !matches;
        if (matches) visible++;
      });
      const count = document.getElementById('inventory-filter-count');
      if (count) count.textContent = `${visible} dari ${rows.length} jenis persediaan`;
    }

    function renderPurchaseHistoryTable() {
      const purchases = db.purchases.slice().sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
      if (!purchases.length) return '<div class="empty">Belum ada pembelian yang tercatat. Gunakan tombol Restock pada barang; setiap transaksi berikutnya otomatis masuk ke riwayat ini. Data lama tidak diisi dengan pembelian contoh.</div>';
      const rows = purchases.slice(0, 100).map(purchase => {
        const item = inventoryItem(purchase.inventoryId);
        const timestamp = purchase.timestamp ? new Date(purchase.timestamp) : null;
        const date = timestamp && !Number.isNaN(timestamp.getTime()) ? timestamp.toLocaleString('id-ID') : '—';
        return `<tr><td>${escapeHtml(date)}</td><td><strong>${escapeHtml(purchase.id || '—')}</strong></td><td class="table-name">${escapeHtml(item?.name || 'Barang tidak ditemukan')}</td><td>${quantity(purchase.quantity)} ${escapeHtml(item?.unit || '')}</td><td>${money(purchase.unitCost)} / ${escapeHtml(item?.unit || '')}</td><td><strong>${money(purchase.total)}</strong></td><td>${escapeHtml(purchase.supplier || '—')}</td><td>${purchase.expiryDate ? escapeHtml(purchase.expiryDate) : '—'}</td></tr>`;
      }).join('');
      return `<div class="section-note">Menampilkan ${Math.min(purchases.length, 100)} dari ${purchases.length} transaksi pembelian terbaru.</div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>No. pembelian</th><th>Nama barang</th><th>Jumlah</th><th>Harga satuan</th><th>Total</th><th>Pemasok</th><th>Kedaluwarsa</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function exportPurchasesCsv() {
      const purchases = db.purchases.slice().sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
      exportCsv('stocklogic_riwayat_pembelian.csv', [['Tanggal', 'No. pembelian', 'Barang', 'Jumlah', 'Satuan', 'Harga satuan', 'Total', 'Pemasok', 'Kedaluwarsa'], ...purchases.map(purchase => {
        const item = inventoryItem(purchase.inventoryId);
        return [purchase.timestamp || '', purchase.id || '', item?.name || 'Barang tidak ditemukan', purchase.quantity, item?.unit || '', purchase.unitCost, purchase.total, purchase.supplier || '', purchase.expiryDate || ''];
      })]);
    }

    function openRestockModal(id) {
      const item = inventoryItem(id);
      showModal(`Restock ${item.name}`, 'Stok ditambahkan ke Gudang Induk dan langsung tersedia untuk transaksi berikutnya.', `
        <form onsubmit="event.preventDefault();restockInventory(${item.id})"><div class="form-grid">
          <label class="field">Jumlah restock (${escapeHtml(item.unit)})<input id="restock-qty" type="number" min="0.001" step="0.001" required placeholder="Contoh: 10"></label>
          <label class="field">Harga beli per ${escapeHtml(item.unit)} (Rp)<input id="restock-cost" type="number" min="0" step="1" value="${item.cost}" required></label>
          <label class="field">Supplier<input id="restock-supplier" maxlength="80" placeholder="Nama supplier / toko"></label>
          <label class="field">Tanggal kedaluwarsa (opsional)<input id="restock-expiry" type="date" value="${escapeHtml(item.expiryDate || '')}"></label>
        </div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Simpan restock</button></div></form>`);
    }

    function restockInventory(id) {
      const item = inventoryItem(id);
      const amount = Number(document.getElementById('restock-qty').value);
      const cost = Number(document.getElementById('restock-cost').value);
      if (!item || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(cost) || cost < 0) return toast('Jumlah dan harga restock harus valid.', 'error');
      const supplier = document.getElementById('restock-supplier').value.trim();
      const expiryDate = document.getElementById('restock-expiry').value;
      if (expiryDate && expiryDate < localDate()) return toast('Tanggal kedaluwarsa tidak boleh di masa lalu.', 'error');
      const beforeState = clone(db);
      const previousStock = Number(item.stock || 0);
      const nextStock = round3(previousStock + amount);
      item.cost = nextStock > 0
        ? round2((previousStock * Number(item.cost || 0) + amount * cost) / nextStock)
        : round2(cost);
      item.stock = nextStock;
      item.expiryDate = expiryDate || item.expiryDate || '';
      let purchaseId = `PO-${Date.now()}`;
      let purchaseSequence = 1;
      while (db.purchases.some(purchase => purchase.id === purchaseId)) purchaseId = `PO-${Date.now()}-${purchaseSequence++}`;
      db.purchases.unshift({ id: purchaseId, inventoryId: item.id, quantity: round3(amount), unitCost: cost, total: round2(amount * cost), supplier, timestamp: new Date().toISOString(), expiryDate });
      recordStockMovement(item, 'warehouse', amount, 'Restock', supplier || 'Pembelian stok');
      if (!saveDB()) {
        db = beforeState;
        render();
        return;
      }
      closeModal();
      toast(`${quantity(amount)} ${item.unit} ${item.name} ditambahkan ke Gudang Induk.`, 'success');
      render();
    }

    function openInventoryModal(id = null) {
      const item = id == null ? null : inventoryItem(id);
      if (id != null && !item) return toast('Bahan tidak ditemukan.', 'error');
      editingInventoryId = item?.id || null;
      showModal(item ? 'Ubah data bahan' : 'Tambah barang gudang', item ? 'Perbarui nama, batas minimum, biaya rata-rata, atau tanggal kedaluwarsa. Satuan tidak diubah agar resep tetap konsisten.' : 'Buat item stok baru untuk dipakai di resep atau dijual melalui Kasir 2.', `
        <form onsubmit="event.preventDefault();createInventory()"><div class="form-grid">
          <label class="field">Nama barang<input id="new-stock-name" maxlength="60" required placeholder="Contoh: Garam" value="${escapeHtml(item?.name || '')}"></label>
          ${item ? `<label class="field">Satuan (tidak dapat diubah)<input value="${escapeHtml(item.unit)}" disabled></label>` : '<label class="field">Satuan<input id="new-stock-unit" maxlength="16" required placeholder="kg, liter, pcs"></label>'}
          ${item ? '' : '<label class="field">Stok awal<input id="new-stock-amount" type="number" min="0" step="0.001" required value="0"></label>'}
          <label class="field">Batas minimum<input id="new-stock-min" type="number" min="0" step="0.001" required value="${item?.min ?? 0}"></label>
          <label class="field">Harga pokok rata-rata per satuan (Rp)<input id="new-stock-cost" type="number" min="0" step="0.01" required value="${item?.cost ?? 0}"></label>
          <label class="field">Tanggal kedaluwarsa (opsional)<input id="new-stock-expiry" type="date" value="${escapeHtml(item?.expiryDate || '')}"></label>
        </div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">＋ &nbsp;Simpan barang</button></div></form>`);
    }

    function createInventory() {
      const name = document.getElementById('new-stock-name').value.trim();
      const current = editingInventoryId ? inventoryItem(editingInventoryId) : null;
      const unit = current?.unit || document.getElementById('new-stock-unit').value.trim();
      const stock = current ? Number(current.stock) : Number(document.getElementById('new-stock-amount').value);
      const min = Number(document.getElementById('new-stock-min').value);
      const cost = Number(document.getElementById('new-stock-cost').value);
      const expiryDate = document.getElementById('new-stock-expiry').value;
      if (!name || !unit || [stock, min, cost].some(value => !Number.isFinite(value) || value < 0)) return toast('Lengkapi semua data barang dengan nilai yang valid.', 'error');
      if (expiryDate && expiryDate < localDate()) return toast('Tanggal kedaluwarsa tidak boleh di masa lalu.', 'error');
      if (db.inventory.some(item => item.name.toLowerCase() === name.toLowerCase() && item.id !== editingInventoryId)) return toast('Nama barang sudah ada di gudang.', 'error');
      const beforeState = clone(db);
      const item = current || { id: Date.now(), name, unit, stock: round3(stock), min: round3(min), cost: round2(cost), expiryDate };
      if (current) Object.assign(item, { name, min: round3(min), cost: round2(cost), expiryDate });
      else {
        db.inventory.push(item);
        if (stock > 0) recordStockMovement(item, 'warehouse', stock, 'Stok awal', 'Barang baru ditambahkan');
      }
      if (!saveDB()) {
        db = beforeState;
        render();
        return;
      }
      closeModal();
      editingInventoryId = null;
      toast(`${name} berhasil ${current ? 'diperbarui' : 'ditambahkan ke Gudang Induk'}.`, 'success');
      render();
    }

    function openInventoryAdjustmentModal(id) {
      const item = inventoryItem(id);
      if (!item) return toast('Bahan tidak ditemukan.', 'error');
      showModal(`Opname stok · ${item.name}`, 'Gunakan nilai positif untuk menambah stok atau negatif untuk mencatat kehilangan. Perubahan memiliki alasan dan riwayat.', `
        <form onsubmit="event.preventDefault();adjustInventory(${item.id})"><label class="field">Perubahan stok (${escapeHtml(item.unit)})<input id="stock-adjustment-qty" type="number" step="0.001" required placeholder="Contoh: -1.5"></label>
          <label class="field" style="margin-top:12px">Alasan penyesuaian<textarea id="stock-adjustment-note" maxlength="160" required placeholder="Contoh: selisih stok opname"></textarea></label>
          <div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="primary">Simpan penyesuaian</button></div></form>`);
    }

    function adjustInventory(id) {
      const item = inventoryItem(id);
      const delta = Number(document.getElementById('stock-adjustment-qty').value);
      const note = document.getElementById('stock-adjustment-note').value.trim();
      if (!item || !Number.isFinite(delta) || delta === 0 || !note) return toast('Masukkan perubahan stok dan alasan yang valid.', 'error');
      if (item.stock + delta < -1e-9) return toast(`Stok ${item.name} tidak boleh negatif; tersedia ${quantity(item.stock)} ${item.unit}.`, 'error');
      const beforeState = clone(db);
      item.stock = round3(Math.max(0, item.stock + delta));
      recordStockMovement(item, 'warehouse', delta, 'Penyesuaian stok', note);
      if (!saveDB()) {
        db = beforeState;
        render();
        return;
      }
      closeModal();
      toast(`Stok ${item.name} disesuaikan ${delta > 0 ? '+' : ''}${quantity(delta)} ${item.unit}.`, 'success');
      render();
    }

    function renderMenu() {
      const cards = db.menus.map(item => `<article class="card menu-card"><div class="menu-card-head">${renderCover(item.cover, item.emoji, 'menu-cover')}<span class="pill ${item.category === 'Sembako' ? '' : 'green'}">${escapeHtml(item.category)}</span></div><div><h3>${escapeHtml(item.name)}</h3><p>${money(item.price)} · ${Number(item.sold) || 0} terjual</p></div><div class="recipe-list"><strong style="color:var(--navy)">Resep · ${item.recipe.length} bahan</strong>${item.recipe.map(part => { const stock = inventoryItem(part.inventoryId); return `<span>• ${escapeHtml(stock?.name || 'Bahan tidak ditemukan')} — ${quantity(part.qty)} ${escapeHtml(stock?.unit || '')} / porsi <span class="pill ${part.source === 'daily' ? 'green' : ''}" style="padding:2px 6px">${part.source === 'daily' ? 'Stok harian' : 'Gudang induk'}</span></span>`; }).join('')}<div class="table-actions"><button class="secondary" onclick="openMenuModal(${item.id})">Ubah menu & resep</button></div></div></article>`).join('');

      showModal(menu ? 'Ubah menu & resep' : 'Tambah menu baru', 'Daftarkan produk beserta resep per porsi. Harga dan takaran harus lebih besar dari nol.', `
