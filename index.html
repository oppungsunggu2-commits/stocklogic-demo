<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172A3A">
  <title>STOCKLOGIC — Operasional UMKM</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #172A3A;
      --blue: #1677C8;
      --cyan: #20C4D8;
      --bg: #f1f5f9;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --white: #fff;
      --green: #059669;
      --red: #dc2626;
      --amber: #d97706;
      --shadow: 0 10px 28px rgba(23, 42, 58, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; width: 258px; flex-direction: column; background: var(--navy); color: #fff; transition: transform .25s ease; }
    .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: #111e28;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .brand-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    }

    .brand-image {
    position: relative;
    width: 74px;        /* Ukuran lingkaran pas di sidebar */
    height: 74px;
    flex: 0 0 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;   /* Memotong bagian luar lingkaran agar tetap bundar sempurna */
    border: 2px solid rgba(32, 196, 216, 0.8);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 20px rgba(32, 196, 216, 0.8), inset 0 0 10px rgba(32, 196, 216, 0.4);
    }

    .brand-image img {
    width: 240%;
    height: auto;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
    position: absolute;  /* Membuat posisi gambar bebas digeser */
    top: 63%;            /* Menggeser titik tengah ke arah bawah (ubah angka 52% ini sesuai kebutuhan) */
    left: 50%;
    transform: translate(-50%, -50%); /* Menjaga agar sumbu tengah gambar tetap pas */
    }
    .brand-copy small {
    display: block;
    font-size: 11px;
    color: #20C4D8;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-top: 2px;
    }
    .brand small { color: #b7c5d1; font-size: 9px; line-height: 1.35; letter-spacing: .035em; }
    .profile { display: flex; gap: 11px; align-items: center; margin: 16px 14px 10px; padding: 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 13px; background: rgba(255,255,255,.06); }
    .avatar { display: grid; width: 36px; height: 36px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: linear-gradient(135deg, var(--blue), var(--cyan)); font-size: 12px; font-weight: 800; }
    .profile strong { display: block; overflow: hidden; max-width: 162px; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .profile small { color: #a9bac8; font-size: 10px; }
    .nav { display: grid; gap: 5px; padding: 12px 12px; overflow-y: auto; }
    .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 10px; background: transparent; color: #bdc9d4; text-align: left; font-size: 12px; transition: color .18s, background .18s, transform .18s; }
    .nav button:hover { transform: translateX(2px); background: rgba(255,255,255,.08); color: #fff; }
    .nav button.active { background: var(--blue); color: #fff; box-shadow: 0 8px 18px rgba(22,119,200,.22); }
    .nav .nav-icon { width: 20px; color: var(--cyan); text-align: center; font-size: 15px; }
    .sidebar-bottom { margin-top: auto; padding: 14px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-bottom button { width: 100%; padding: 9px; border: 1px solid rgba(248,113,113,.25); border-radius: 9px; background: rgba(220,38,38,.12); color: #fda4af; font-size: 11px; font-weight: 700; }
    .shell { display: flex; min-width: 0; min-height: 100vh; width: calc(100% - 258px); flex: 1 1 auto; flex-direction: column; margin-left: 258px; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; min-height: 76px; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 30px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(12px); }
    .topbar h1 { margin: 0; color: var(--navy); font-size: 17px; letter-spacing: -.025em; }
    .topbar p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .store-status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid #dbeafe; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .store-status.closed { border-color: #fde68a; background: #fffbeb; color: #92400e; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 0 rgba(16,185,129,.45); animation: pulse 1.8s infinite; }
    .closed .dot { background: #f59e0b; box-shadow: none; animation: none; }
    @keyframes pulse { 60% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } }
    .primary, .secondary, .danger, .ghost { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border: 0; border-radius: 10px; font-size: 11px; font-weight: 800; transition: transform .18s, box-shadow .18s, background .18s; }
    .primary { background: var(--blue); color: #fff; box-shadow: 0 5px 12px rgba(22,119,200,.16); }
    .primary:hover { transform: translateY(-1px); background: #1268b1; box-shadow: 0 8px 18px rgba(22,119,200,.22); }
    .secondary { border: 1px solid var(--line); background: #fff; color: var(--navy); }
    .secondary:hover, .ghost:hover { background: #f8fafc; }
    .danger { background: #fee2e2; color: #b91c1c; }
    .danger:hover { background: #fecaca; }
    .ghost { min-height: 32px; padding: 6px 9px; background: transparent; color: var(--muted); }
    .mobile-toggle { display: none; border: 0; background: transparent; color: var(--navy); font-size: 20px; }
    main { width: 100%; max-width: 1500px; margin: 0 auto; padding: 26px 30px 42px; }
    .page { animation: rise .28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .page-heading h2 { margin: 0; color: var(--navy); font-size: 21px; letter-spacing: -.035em; }
    .page-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 25px 28px; overflow: hidden; border-radius: 18px; background: linear-gradient(115deg, #172A3A, #164f7b 70%, #1677C8); color: #fff; box-shadow: 0 14px 28px rgba(23,42,58,.15); }
    .hero-copy { max-width: 650px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: #8ceaf3; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .hero h2 { margin: 10px 0 6px; font-size: clamp(20px, 2.4vw, 29px); letter-spacing: -.04em; }
    .hero p { margin: 0; color: #d2e0eb; font-size: 12px; }
    .hero .primary { min-height: 44px; flex: 0 0 auto; background: var(--cyan); color: var(--navy); }
    .hero .danger { min-height: 44px; flex: 0 0 auto; background: #ef4444; color: #fff; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0,1fr)); margin: 20px 0; }
    .card, .stat { border: 1px solid var(--line); border-radius: 15px; background: var(--white); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s, border-color .2s; }
    .stat:hover, .card:hover { transform: translateY(-2px); border-color: #cbdced; box-shadow: 0 15px 32px rgba(23,42,58,.1); }
    .stat { padding: 17px; }
    .stat-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-value { margin-top: 7px; color: var(--navy); font-size: 21px; font-weight: 850; letter-spacing: -.035em; }
    .stat-foot { margin-top: 9px; color: var(--muted); font-size: 10px; }
    .stat-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; background: #eff6ff; color: var(--blue); font-size: 16px; }
    .stat-icon.green { background: #ecfdf5; color: var(--green); }
    .stat-icon.cyan { background: #ecfeff; color: #0891b2; }
    .stat-icon.amber { background: #fffbeb; color: var(--amber); }
    .two-col { grid-template-columns: minmax(0,1.55fr) minmax(270px,.9fr); }
    .card { padding: 20px; }
    .card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .card-title h3 { margin: 0; color: var(--navy); font-size: 13px; }
    .card-title p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: #eff6ff; color: var(--blue); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .pill.green { background: #ecfdf5; color: #047857; }
    .pill.amber { background: #fffbeb; color: #a16207; }
    .pill.red { background: #fef2f2; color: #b91c1c; }
    .list { display: grid; gap: 9px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid #edf1f5; border-radius: 11px; background: #fbfdff; }
    .row-main { min-width: 0; }
    .row-main strong { display: block; overflow: hidden; color: var(--navy); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .row-main small { color: var(--muted); font-size: 10px; }
    .row-side { flex: 0 0 auto; text-align: right; }
    .row-side strong { display: block; color: var(--navy); font-size: 11px; }
    .row-side small { color: var(--muted); font-size: 10px; }
    .empty { padding: 30px 14px; border: 1px dashed #cbd5e1; border-radius: 12px; color: var(--muted); text-align: center; font-size: 11px; }
    .split-banner { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
    .source-card { display: flex; align-items: center; gap: 14px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .source-icon { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 13px; background: #eaf5ff; font-size: 20px; }
    .source-card h3 { margin: 0; color: var(--navy); font-size: 12px; }
    .source-card p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .pos-layout { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(290px,.85fr); gap: 16px; align-items: start; }
    .pos-products { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 11px; }
    .product { position: relative; display: flex; min-height: 160px; flex-direction: column; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; transition: transform .18s, border-color .18s, box-shadow .18s; }
    .product:hover { transform: translateY(-3px); border-color: #80bce9; box-shadow: 0 12px 22px rgba(22,119,200,.1); }
    .product:disabled { filter: grayscale(.4); }
    .product-cover { display: grid; width: 58px; height: 58px; place-items: center; overflow: hidden; border: 1px solid #e8eef5; border-radius: 12px; background: #f8fafc; font-size: 30px; }
    .product-cover img { width: 100%; height: 100%; object-fit: cover; }
    .product strong { margin-top: 9px; color: var(--navy); font-size: 11px; }
    .product small { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .product b { margin-top: auto; padding-top: 12px; color: var(--blue); font-size: 12px; }
    .product .stock-tag { position: absolute; top: 10px; right: 9px; padding: 4px 6px; border-radius: 7px; background: #f1f5f9; color: #475569; font-size: 9px; }
    .cart-card { position: sticky; top: 94px; }
    .cart-lines { display: grid; max-height: 350px; gap: 8px; overflow: auto; }
    .cart-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px; border-radius: 10px; background: #f8fafc; }
    .cart-line strong { display: block; color: var(--navy); font-size: 10px; }
    .cart-line small { color: var(--muted); font-size: 10px; }
    .qty-control { display: flex; align-items: center; gap: 7px; }
    .qty-control button { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--navy); font-weight: 800; }
    .cart-total { display: flex; justify-content: space-between; gap: 8px; padding: 15px 0; border-top: 1px solid var(--line); color: var(--navy); font-size: 12px; font-weight: 800; }
    .tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .tabs button { padding: 7px 11px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; }
    .tabs button.active { background: var(--navy); color: #fff; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 12px 14px; border-bottom: 1px solid var(--line); background: #f8fafc; color: var(--muted); font-size: 10px; font-weight: 800; }
    td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 11px; }
    tr:last-child td { border-bottom: 0; }
    .table-name { color: var(--navy); font-weight: 800; }
    .table-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .section-note { margin: 0 0 14px; color: var(--muted); font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .field { display: grid; gap: 5px; color: #475569; font-size: 10px; font-weight: 800; }
    .field input, .field select, .field textarea { width: 100%; min-height: 39px; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 9px; outline: 0; background: #fff; color: var(--ink); font: inherit; font-size: 11px; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22,119,200,.12); }
    .recipe-row { display: grid; grid-template-columns: minmax(130px,1.4fr) minmax(100px,.9fr) minmax(85px,.65fr) 32px; gap: 8px; align-items: end; padding: 10px; border: 1px solid #edf1f5; border-radius: 11px; background: #fbfdff; }
    .recipe-row .remove-row { min-height: 38px; padding: 0; }
    .menu-grid { grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); }
    .menu-card { display: flex; flex-direction: column; gap: 12px; padding: 17px; }
    .menu-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .menu-cover { display: grid; width: 58px; height: 58px; place-items: center; overflow: hidden; border: 1px solid #e8eef5; border-radius: 12px; background: #f8fafc; font-size: 30px; }
    .menu-cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover-options { display: grid; gap: 12px; }
    .cover-tabs { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafc; }
    .cover-tabs button { flex: 1; padding: 8px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; }
    .cover-tabs button.active { background: #fff; color: var(--blue); box-shadow: 0 1px 4px rgba(15,23,42,.12); }
    .cover-panel { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdff; }
    .cover-panel[hidden] { display: none; }
    .cover-upload-row { display: flex; align-items: center; gap: 12px; }
    .cover-preview { display: grid; width: 76px; height: 76px; flex: 0 0 76px; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 38px; }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .cover-emoji-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .cover-emoji-grid button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 20px; transition: border-color .16s, background .16s, transform .16s; }
    .cover-emoji-grid button:hover { transform: translateY(-1px); border-color: #93c5fd; }
    .cover-emoji-grid button.active { border-color: var(--blue); background: #eff6ff; box-shadow: 0 0 0 2px rgba(22,119,200,.12); }
    .menu-card h3 { margin: 8px 0 2px; color: var(--navy); font-size: 13px; }
    .menu-card p { margin: 0; color: var(--muted); font-size: 10px; }
    .recipe-list { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); color: #475569; font-size: 10px; }
    .report-summary { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgba(15,23,42,.53); backdrop-filter: blur(5px); animation: fade .16s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: min(100%,620px); max-height: min(90vh,850px); overflow: auto; padding: 22px; border: 1px solid rgba(255,255,255,.5); border-radius: 17px; background: #fff; box-shadow: 0 24px 80px rgba(15,23,42,.28); animation: rise .2s ease; }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .modal-head h3 { margin: 0; color: var(--navy); font-size: 16px; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .modal-close { width: 30px; height: 30px; border: 0; border-radius: 8px; background: #f1f5f9; color: #475569; font-size: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast-area { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: grid; width: min(370px,calc(100vw - 32px)); gap: 8px; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 12px; background: var(--navy); color: #fff; box-shadow: 0 12px 32px rgba(15,23,42,.22); font-size: 11px; animation: toast-in .25s ease both; }
    .toast.success { background: #047857; }
    .toast.error { background: #b91c1c; }
    .toast.warning { background: #a16207; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px) translateX(6px); } to { opacity: 1; transform: translateY(0) translateX(0); } }
    .analytics-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .chart { width: 100%; min-height: 210px; overflow: visible; }
    .chart-frame { position: relative; }
    .chart-empty { position: absolute; inset: 14px 12px 28px 54px; display: grid; place-items: center; padding: 12px; border-radius: 10px; background: rgba(255,255,255,.82); color: var(--muted); text-align: center; font-size: 12px; font-weight: 700; pointer-events: none; }
    .chart-label { fill: #64748b; font: 10px system-ui,sans-serif; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 10px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .chart-legend i { width: 9px; height: 9px; border-radius: 3px; }
    .assistant-answer { padding: 11px 13px; border-radius: 11px; background: #eff6ff; color: #1e3a5f; font-size: 11px; line-height: 1.65; }
    .journal-item { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px; padding: 12px; border: 1px solid #edf1f5; border-radius: 11px; background: #fbfdff; }
    .journal-item.done strong { color: #94a3b8; text-decoration: line-through; }
    .journal-item p { margin: 4px 0; color: #475569; font-size: 11px; }
    .alert-list { display: grid; gap: 8px; }
    .alert-item { padding: 10px 12px; border: 1px solid #fde68a; border-radius: 10px; background: #fffbeb; color: #92400e; font-size: 11px; }
    .filter-row { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 14px; }
    .filter-row .field { min-width: 150px; }
    .badge-cancelled { background: #fef2f2; color: #b91c1c; }
    .split-banner .tabs { flex: 0 0 auto; }
    @media (max-width: 760px) { .analytics-grid { grid-template-columns: 1fr; } }
    .mobile-overlay { display: none; }
    @media (max-width: 1100px) { .stats, .report-summary { grid-template-columns: repeat(2,minmax(0,1fr)); } .pos-layout { grid-template-columns: minmax(0,1.3fr) minmax(260px,.8fr); } }
    @media (max-width: 760px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .mobile-overlay.show { position: fixed; inset: 0; z-index: 15; display: block; background: rgba(15,23,42,.35); }
      .shell { width: 100%; margin-left: 0; }
      .mobile-toggle { display: inline-grid; place-items: center; }
      .topbar { min-height: 68px; padding: 10px 15px; }
      .topbar h1 { font-size: 14px; }
      .topbar p { display: none; }
      main { padding: 19px 15px 32px; }

          const purchase = {
            id: `DEMO-PO-${String(demo.purchases.length + 1).padStart(4, '0')}`,
            inventoryId: item.id, quantity: batchQuantity, unitCost,
            total: round2(batchQuantity * unitCost),
            supplier: ['Pasar Induk', 'CV Segar Jaya', 'Toko Grosir Makmur'][Math.floor(random() * 3)],
            timestamp: purchaseDate.toISOString(),
            expiryDate: item.expiryDate || ''
          };
          demo.purchases.push(purchase);
          purchaseTotal += purchase.total;
          movement(purchaseDate, item.id, 'warehouse', batchQuantity, 'Restock', `${purchase.id} · ${purchase.supplier}`);
        });
        item.cost = round2((item.stock * item.cost + purchaseTotal) / (item.stock + quantityBought));
        item.stock = round3(item.stock + quantityBought);
      });

      const warehouseStock = new Map(demo.inventory.map(item => [item.id, item.stock]));
      let currentDay = '';
      let dailyStock = new Map();
      const dayMovement = new Map();
      for (const transaction of drafts) {
        if (transaction.date !== currentDay) {
          if (currentDay) {
            for (const [id, quantity] of dailyStock) {
              if (quantity > 0) {
                warehouseStock.set(id, round3(warehouseStock.get(id) + quantity));
                const date = new Date(`${currentDay}T21:55:00`);
                movement(date, id, 'daily', -quantity, 'Penutupan shift', 'Sisa stok shift demo dikembalikan');
                movement(date, id, 'warehouse', quantity, 'Penutupan shift', 'Sisa stok shift demo dikembalikan');
              }
            }
            for (const [key, quantity] of dayMovement) {
              const [source, id] = key.split(':');
              movement(new Date(`${currentDay}T21:50:00`), Number(id), source, -quantity, 'Penjualan', 'Rekap transaksi demo harian');
            }
          }
          currentDay = transaction.date;
          dailyStock = new Map();
          dayMovement.clear();
          const dailyNeeds = [...dailyUsage.entries()].filter(([key]) => key.startsWith(`${currentDay}:daily:`));
          for (const [key, used] of dailyNeeds) {
            const id = Number(key.split(':')[2]);
            const allocation = round3(used * 1.1);
            warehouseStock.set(id, round3(warehouseStock.get(id) - allocation));
            dailyStock.set(id, allocation);
            movement(new Date(`${currentDay}T07:00:00`), id, 'warehouse', -allocation, 'Alokasi shift', 'Alokasi stok jualan demo');
            movement(new Date(`${currentDay}T07:00:00`), id, 'daily', allocation, 'Alokasi shift', 'Alokasi stok jualan demo');
            dayMovement.set(`daily:${id}`, used);
          }
        }

        let cogs = 0;
        const consumed = new Map();
        for (const line of transaction.lines) {
          const menu = menus.get(line.id);
          menu.sold += line.qty;
          menu.recipe.forEach(part => {
            const item = inventory.get(part.inventoryId);
            const qty = Number(part.qty) * line.qty;
            cogs += qty * item.cost;
            const key = `${part.source}:${item.id}`;
            consumed.set(key, (consumed.get(key) || 0) + qty);
            if (part.source === 'daily') dailyStock.set(item.id, round3((dailyStock.get(item.id) || 0) - qty));
            else warehouseStock.set(item.id, round3(warehouseStock.get(item.id) - qty));
          });
        }
        const subtotal = transaction.lines.reduce((sum, line) => sum + line.price * line.qty, 0);
        demo.transactions.unshift({
          ...transaction,
          timestamp: transaction.timestamp.toISOString(),
          items: transaction.lines.map(line => `${line.name} (${line.qty})`).join(', '),
          consumption: [...consumed.entries()].map(([key, qty]) => {
            const [source, inventoryId] = key.split(':');
            return { source, inventoryId: Number(inventoryId), qty: round3(qty) };
          }),
          discount: 0, total: subtotal, cogs: round2(cogs), profit: round2(subtotal - cogs),
          paymentStatus: 'Dikonfirmasi (demo)', status: 'Selesai', cancelled: false, isSimulated: true
        });
        transaction.lines.forEach(line => {
          const menu = menus.get(line.id);
          menu.recipe.forEach(part => {
            const key = `${part.source}:${part.inventoryId}`;
            if (part.source === 'warehouse') dayMovement.set(key, (dayMovement.get(key) || 0) + Number(part.qty) * line.qty);
          });
        });
      }
      if (currentDay) {
        for (const [id, quantity] of dailyStock) {
          if (quantity > 0) {
            warehouseStock.set(id, round3(warehouseStock.get(id) + quantity));
            const date = new Date(`${currentDay}T21:55:00`);
            movement(date, id, 'daily', -quantity, 'Penutupan shift', 'Sisa stok shift demo dikembalikan');
            movement(date, id, 'warehouse', quantity, 'Penutupan shift', 'Sisa stok shift demo dikembalikan');
          }
        }
        for (const [key, quantity] of dayMovement) {
          const [source, id] = key.split(':');
          movement(new Date(`${currentDay}T21:50:00`), Number(id), source, -quantity, 'Penjualan', 'Rekap transaksi demo harian');
        }
      }
      demo.inventory.forEach(item => { item.stock = Math.max(0, warehouseStock.get(item.id)); });
      demo.purchases.reverse();
      demo.stockMovements.reverse();
      demo.stockMovements = demo.stockMovements.slice(0, 1000);
      const daysAgo = days => {
        const date = new Date();
        date.setDate(date.getDate() - days);
        return localDate(date);
      };
      demo.expenses = [
        { id: 'DEMO-EXP-001', date: daysAgo(29), category: 'Sewa', amount: 2500000, note: 'Sewa tempat bulanan' },
        { id: 'DEMO-EXP-002', date: daysAgo(15), category: 'Gaji', amount: 3500000, note: 'Gaji dua karyawan' },
        { id: 'DEMO-EXP-003', date: daysAgo(9), category: 'Listrik', amount: 680000, note: 'Tagihan listrik' },
        { id: 'DEMO-EXP-004', date: daysAgo(5), category: 'Gas', amount: 240000, note: 'Isi ulang LPG' },
        { id: 'DEMO-EXP-005', date: daysAgo(2), category: 'Air', amount: 175000, note: 'Tagihan air dan kebersihan' }
      ];
      demo.inventory.find(item => item.id === 2).expiryDate = daysAgo(-3);
      demo.inventory.find(item => item.id === 15).expiryDate = daysAgo(-2);
      demo.demoHistoryImported = true;
      return demo;
    }

    function recordStockMovement(item, source, delta, type, note) {
      db.stockMovements.push({
        id: `${Date.now()}-${db.stockMovements.length}`,
        timestamp: new Date().toISOString(),
        inventoryId: item.id,
        source,
        delta: round3(delta),
        type,
        note
      });
      if (db.stockMovements.length > 1000) db.stockMovements.splice(0, db.stockMovements.length - 1000);
    }

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        return true;
      } catch (error) {
        console.error('Gagal menyimpan data STOCKLOGIC ke localStorage:', error);
        toast('Penyimpanan browser gagal. Periksa ruang penyimpanan atau izin browser.', 'error');
        return false;
      }
    }

    function expandInventoryCatalog(inventory) {
      const expanded = clone(Array.isArray(inventory) ? inventory : []);
      const names = new Set(expanded.map(item => String(item.name || '').trim().toLowerCase()));
      const ids = new Set(expanded.map(item => Number(item.id)));
      let nextId = Math.max(0, ...ids) + 1;
      for (const template of DEFAULT_DATA.inventory) {
        const name = String(template.name).trim().toLowerCase();
        if (names.has(name)) continue;
        const id = ids.has(template.id) ? nextId++ : template.id;
        expanded.push({ ...clone(template), id, stock: 0 });
        names.add(name);
        ids.add(id);
      }
      return expanded;
    }

    function loadDB() {
      let saved;
      try {
        saved = localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        console.error('Data STOCKLOGIC tidak dapat diakses dari localStorage:', error);
        toast('Penyimpanan browser tidak dapat diakses. Perubahan hanya berlaku selama halaman ini terbuka.', 'error');
        return createDemoData();
      }
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.version === 3 && !validateBackupData(parsed)) {
            return { ...clone(DEFAULT_DATA), ...parsed, inventory: expandInventoryCatalog(parsed.inventory), shift: { ...clone(DEFAULT_DATA.shift), ...parsed.shift }, transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [], shiftHistory: Array.isArray(parsed.shiftHistory) ? parsed.shiftHistory : [], expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [], notes: Array.isArray(parsed.notes) ? parsed.notes : [], stockMovements: Array.isArray(parsed.stockMovements) ? parsed.stockMovements : [], purchases: Array.isArray(parsed.purchases) ? parsed.purchases : [], shop: { ...clone(DEFAULT_DATA.shop), ...(parsed.shop || {}) } };
          }
          throw new Error(validateBackupData(parsed) || 'Format data STOCKLOGIC tersimpan tidak dikenal.');
        } catch (error) {
          console.error('Data STOCKLOGIC tersimpan tidak dapat dibaca:', error);
          try {
            localStorage.setItem(`${STORAGE_KEY}_recovery`, saved);
          } catch (backupError) {
            console.error('Salinan pemulihan data STOCKLOGIC gagal dibuat:', backupError);
          }
          toast('Data tersimpan rusak atau tidak dikenal. Salinan pemulihan disimpan jika ruang browser tersedia; data contoh dimuat.', 'error');
          return createDemoData();
        }
      }
      let old;
      try {
        old = localStorage.getItem(LEGACY_KEY);
      } catch (error) {
        console.error('Data STOCKLOGIC lama tidak dapat diakses:', error);
        toast('Data lama tidak dapat dibaca dari penyimpanan browser.', 'error');
        return createDemoData();
      }
      if (old) {
        try {
          const legacy = JSON.parse(old);
          const migrated = clone(DEFAULT_DATA);
          if (Array.isArray(legacy.ingredients)) {
            migrated.inventory = legacy.ingredients.map(item => ({ id: Number(item.id), name: item.name, unit: item.unit || 'pcs', stock: Number(item.stock) || 0, min: Number(item.min) || 0, cost: Number(item.price) || 0 }));
          }
          if (Array.isArray(legacy.menus)) {
            migrated.menus = legacy.menus.map(item => ({
              id: Number(item.id), name: item.name, category: item.category || 'Makanan', price: Number(item.price) || 0, emoji: item.emoji || '🍽️', sold: Number(item.sold) || 0,
              recipe: (item.recipe || []).map(part => ({ inventoryId: Number(part.ingId), source: item.category === 'Sembako' ? 'warehouse' : 'daily', qty: Number(part.qty) || 0 }))
            })).filter(item => item.recipe.length);
          }
          migrated.transactions = (legacy.transactions || []).map((item, index) => ({ id: item.id || `MIG-${index + 1}`, cashier: 'daily', timestamp: new Date().toISOString(), date: localDate(), items: item.items || 'Transaksi sebelumnya', total: Number(item.total) || 0, cogs: Math.max(0, (Number(item.total) || 0) - (Number(item.profit) || 0)), profit: Number(item.profit) || 0 }));
          return migrated;
        } catch (error) {
          console.error('Migrasi data STOCKLOGIC sebelumnya gagal:', error);
          toast('Migrasi data lama gagal. Data contoh dimuat; file lama tetap tersedia.', 'error');
          return createDemoData();
        }
      }
      return createDemoData();
    }

    function appendDemoHistory(data) {
      if (data.demoHistoryImported) return 0;
      const demo = createDemoData();
      data.inventory = expandInventoryCatalog(data.inventory);
      const inventoryByName = new Map(data.inventory.map(item => [item.name.trim().toLocaleLowerCase('id-ID'), item]));
      const inventoryIdMap = new Map(demo.inventory.map(item => [
        item.id,
        inventoryByName.get(item.name.trim().toLocaleLowerCase('id-ID'))?.id
      ]));
      const menuIds = new Set(data.menus.map(menu => Number(menu.id)));
      const menuByName = new Map(data.menus.map(menu => [menu.name.trim().toLocaleLowerCase('id-ID'), menu]));
      const menuIdMap = new Map();
      let nextMenuId = Math.max(0, ...menuIds) + 1;
      for (const template of demo.menus) {
        const key = template.name.trim().toLocaleLowerCase('id-ID');
        const existing = menuByName.get(key);
        if (existing) {
          menuIdMap.set(template.id, existing.id);
          continue;
        }
        let id = menuIds.has(template.id) ? nextMenuId++ : template.id;
        while (menuIds.has(id)) id = nextMenuId++;
        const menu = clone(template);
        menu.id = id;
        menu.sold = 0;
        menu.recipe = menu.recipe.map(part => ({ ...part, inventoryId: inventoryIdMap.get(part.inventoryId) ?? part.inventoryId }));
        data.menus.push(menu);
        menuIds.add(id);
        menuByName.set(key, menu);
        menuIdMap.set(template.id, id);
      }

      const simulatedDates = new Set(data.transactions
        .filter(transaction => transaction.isSimulated || String(transaction.id).startsWith('DEMO-'))
        .map(transactionDate));
      const transactionIds = new Set(data.transactions.map(transaction => String(transaction.id)));
      const additions = [];
      for (const source of demo.transactions) {
        if (simulatedDates.has(transactionDate(source))) continue;
        const transaction = clone(source);
        transaction.lines = transaction.lines.map(line => ({ ...line, id: menuIdMap.get(line.id) ?? line.id }));
        transaction.consumption = [];
        transaction.shiftId = null;
        transaction.isSimulated = true;
        if (transactionIds.has(transaction.id)) {
          let suffix = 1;
          while (transactionIds.has(`${transaction.id}-SIM-${suffix}`)) suffix++;
          transaction.id = `${transaction.id}-SIM-${suffix}`;
        }
        transactionIds.add(transaction.id);
        additions.push(transaction);
      }
      data.transactions.forEach(transaction => {
        if (String(transaction.id).startsWith('DEMO-')) {
          transaction.isSimulated = true;
          transaction.consumption = [];
        }
      });
      data.transactions.push(...additions);
      data.transactions.sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
      data.demoHistoryImported = true;
      data.demoHistoryImportedCount = additions.length;
      return additions.length;
    }

    function toast(message, type = 'info') {
      const host = document.getElementById('toast-area');
      const item = document.createElement('div');
      item.className = `toast ${type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : ''}`;
      const icon = type === 'success' ? '✓' : type === 'error' ? '!' : type === 'warning' ? '⚠' : '•';
      item.innerHTML = `<strong>${icon}</strong><span>${escapeHtml(message)}</span>`;
      host.appendChild(item);
      setTimeout(() => item.remove(), 3600);
    }
